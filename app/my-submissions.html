<!DOCTYPE html>
<html class="lantern-pilot-auth-pending" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>window.LANTERN_AVATAR_API = '';</script>
  <script src="js/lantern-pilot-auth.js"></script>
  <style>html.lantern-pilot-auth-pending body { visibility: hidden; }</style>
  <title>TMS Lantern — My Submissions</title>
  <link rel="stylesheet" href="css/lantern-ticker.css">
  <link rel="stylesheet" href="css/lantern-header.css">
  <link rel="stylesheet" href="css/lantern-feed.css">
  <style>
    body { margin: 0; background: #0b1220; color: #eaf0ff; font-family: system-ui, sans-serif; font-size: 22px; }
    .pageWrap { padding: 0 16px 32px; }
    .statusBadge { font-size: 18px; font-weight: 900; padding: 4px 10px; border-radius: 8px; display: inline-block; }
    .statusBadge--draft { background: rgba(255,255,255,.1); }
    .statusBadge--submitted { background: rgba(255,204,102,.2); color: #ffcc66; }
    .statusBadge--approved { background: rgba(56,208,124,.2); color: #38d07c; }
    .statusBadge--rejected { background: rgba(255,77,109,.2); color: #ff4d6d; }
    .privateFeedback { margin-top: 8px; font-size: 22px; color: #ffcc66; }
  </style>
</head>
<body class="page-has-ticker">
  <script>
  (function () {
    var auth = window.LanternAuth || window.LanternPilotAuth;
    if (!auth || typeof auth.guardPilotPage !== 'function') {
      location.replace('/login.html?return=' + encodeURIComponent('/my-submissions.html'));
      return;
    }
    auth.guardPilotPage({ mode: 'general' }, function (data) {
      window.LANTERN_PILOT_ME = data;
      document.documentElement.classList.remove('lantern-pilot-auth-pending');
      load();
    });
  })();
  </script>
  <div id="lanternHeader">
    <div id="lanternTicker"></div>
    <div id="lanternAppBarRoot"></div>
  </div>
  <div class="wrap lanternContent pageWrap">
    <h1 class="feedPageTitle">My Submissions</h1>
    <p class="feedPageSub">Drafts, pending review, approved, and returned items.</p>
    <div id="submissionsList"></div>
    <h2 class="feedPageTitle" style="font-size:26px;margin-top:28px;">My Trivia</h2>
    <div id="triviaList"></div>
    <p style="margin-top:20px;"><a href="create.html">Create something new →</a></p>
  </div>
  <script src="js/lantern-nav.js"></script>
  <script src="js/lantern-ticker.js"></script>
  <script src="js/lantern-route-help.js"></script>
  <script src="js/lantern-help.js"></script>
  <script src="js/lantern-feed-api.js"></script>
  <script>
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;';
    });
  }
  function load() {
    var feed = window.LANTERN_FEED;
    if (!feed) return;
    feed.getMine().then(function (res) {
      var el = document.getElementById('submissionsList');
      if (!el) return;
      var items = (res && res.items) || [];
      if (!items.length) { el.innerHTML = '<p class="feedPageSub">No submissions yet.</p>'; return; }
      el.innerHTML = items.map(function (it) {
        var st = String(it.status || '').toLowerCase();
        var fb = it.privateFeedback ? '<p class="privateFeedback"><strong>Teacher feedback:</strong> ' + esc(it.privateFeedback) + '</p>' : '';
        return '<article class="reviewRow">' +
          '<span class="statusBadge statusBadge--' + esc(st) + '">' + esc(st) + '</span>' +
          '<h3 class="reviewRowTitle">' + esc(it.title) + '</h3>' +
          '<p class="reviewRowMeta">' + esc(it.typeLabel || it.type) + ' · ' + esc(it.createdAt || '') + '</p>' +
          '<p>' + esc(it.summary || it.body || '') + '</p>' + fb +
          '</article>';
      }).join('');
    });
    feed.triviaMine().then(function (res) {
      var el = document.getElementById('triviaList');
      if (!el) return;
      var items = (res && res.items) || [];
      if (!items.length) { el.innerHTML = '<p class="feedPageSub">No trivia questions yet.</p>'; return; }
      el.innerHTML = items.map(function (it) {
        var st = String(it.status || '').toLowerCase();
        var fb = it.privateFeedback ? '<p class="privateFeedback">' + esc(it.privateFeedback) + '</p>' : '';
        return '<article class="reviewRow">' +
          '<span class="statusBadge statusBadge--' + esc(st) + '">' + esc(st) + '</span>' +
          '<h3 class="reviewRowTitle">' + esc(it.question) + '</h3>' + fb +
          '</article>';
      }).join('');
    });
  }
  </script>
</body>
</html>

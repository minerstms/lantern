<!DOCTYPE html>
<html class="lantern-pilot-auth-pending" lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/assets/favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>window.LANTERN_AVATAR_API = '';</script>
  <script src="js/lantern-pilot-auth.js"></script>
  <style>html.lantern-pilot-auth-pending body { visibility: hidden; }</style>
  <title>Create | Lantern</title>
  <link rel="stylesheet" href="css/lantern-ticker.css">
  <link rel="stylesheet" href="css/lantern-header.css">
  <link rel="stylesheet" href="css/lantern-feed.css">
  <link rel="stylesheet" href="css/lantern-writing-quality.css">
  <style>
    body { margin: 0; color: #eaf0ff; font-family: system-ui, sans-serif; font-size: 22px; }
    .createWrap { padding: 0 16px 32px; max-width: 640px; }
    #createMediaMount { margin: 12px 0 16px; }
    .createFormActions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
    .createFormActions button { font-size: 22px; padding: 12px 18px; border-radius: 12px; cursor: pointer; font-family: inherit; font-weight: 800; }
    .createForm label { display: block; margin-top: 14px; font-weight: 800; }
    .createForm input[type="text"], .createForm textarea, .createForm select {
      width: 100%; box-sizing: border-box; font-size: 22px; padding: 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25); color: #eaf0ff; font-family: inherit;
    }
    .createForm textarea { min-height: 120px; resize: vertical; }
  </style>
</head>
<body class="page-has-ticker">
  <script>
  (function () {
    var auth = window.LanternAuth || window.LanternPilotAuth;
    if (!auth || typeof auth.guardPilotPage !== 'function') {
      location.replace('/login.html?return=' + encodeURIComponent('/create.html'));
      return;
    }
    auth.guardPilotPage({ mode: 'general' }, function (data) {
      window.LANTERN_PILOT_ME = data;
      if (auth.applyStudentStorageFromSession) auth.applyStudentStorageFromSession(data);
      document.documentElement.classList.remove('lantern-pilot-auth-pending');
    });
  })();
  </script>
  <div id="lanternHeader">
    <div id="lanternTicker"></div>
    <div id="lanternAppBarRoot"></div>
  </div>
  <div class="wrap lanternContent createWrap">
    <h1 class="feedPageTitle">Create &amp; Submit</h1>
    <p class="feedPageSub">Draft your item, then submit for teacher approval. Nothing goes public until approved.</p>
    <form id="createForm" class="createForm">
      <label for="createType">Content type</label>
      <select id="createType" required>
        <option value="article">Article</option>
        <option value="news">News</option>
        <option value="photo">Photo</option>
        <option value="video">Video</option>
        <option value="shout_out">Shout-Out</option>
        <option value="achievement">Achievement</option>
      </select>
      <label for="createTitle">Title</label>
      <input id="createTitle" type="text" required maxlength="200">
      <label for="createBody">Body or summary</label>
      <textarea id="createBody" required maxlength="5000"></textarea>
      <label>Image (optional)</label>
      <div id="createMediaMount"></div>
      <div class="createFormActions">
        <button type="button" id="saveDraftBtn">Save draft</button>
        <button type="button" id="submitReviewBtn">Submit for teacher review</button>
      </div>
    </form>
    <p id="createStatus" class="feedPageSub"></p>
    <p><a href="my-submissions.html">View my submissions →</a></p>
    <hr style="border-color:rgba(255,255,255,.12);margin:24px 0">
    <h2 class="feedPageTitle" style="font-size:26px;">Trivia question</h2>
    <form id="triviaForm" class="createForm">
      <label for="triviaQ">Question</label>
      <input id="triviaQ" type="text" required>
      <label for="triviaCorrect">Correct answer</label>
      <input id="triviaCorrect" type="text" required>
      <label for="triviaWrong1">Wrong answer 1</label>
      <input id="triviaWrong1" type="text" required>
      <label for="triviaWrong2">Wrong answer 2</label>
      <input id="triviaWrong2" type="text" required>
      <label for="triviaWrong3">Wrong answer 3 (optional)</label>
      <input id="triviaWrong3" type="text">
      <div class="createFormActions">
        <button type="button" id="triviaDraftBtn">Save trivia draft</button>
        <button type="button" id="triviaSubmitBtn">Submit trivia for review</button>
      </div>
    </form>
    <p id="triviaStatus" class="feedPageSub"></p>
  </div>
  <script src="js/lantern-staff-nav.js"></script>
  <script src="js/lantern-action-counts.js"></script>
  <script src="js/lantern-nav.js"></script>
  <script src="js/lantern-ticker.js"></script>
  <script src="js/lantern-route-help.js"></script>
  <script src="js/lantern-help.js"></script>
  <script src="js/lantern-unified-media-field.js"></script>
  <script src="js/lantern-feed-api.js"></script>
  <script src="js/lantern-writing-quality.js"></script>
  <script>
  (function () {
    var feed = window.LANTERN_FEED;
    var draftId = null;
    var triviaId = null;
    var isFeedResubmit = false;
    var createUnifiedField = null;
    var createMediaEdit = (window.LanternMediaEdit && window.LanternMediaEdit.create) ? window.LanternMediaEdit.create() : { existing: null, local: null, intent: 'keep' };
    var createLocalImage = { dataUrl: '', mime: 'image/png', fileName: 'image.png' };
    var statusEl = document.getElementById('createStatus');
    var triviaStatus = document.getElementById('triviaStatus');

    function setStatus(msg) { if (statusEl) statusEl.textContent = msg || ''; }
    function setTriviaStatus(msg) { if (triviaStatus) triviaStatus.textContent = msg || ''; }

    function refreshCreateMediaPreview() {
      if (!createUnifiedField || !window.LanternMediaEdit) return;
      var html = window.LanternMediaEdit.buildPreviewHTML(createMediaEdit);
      if (html) {
        createUnifiedField.setPreviewHTML(html);
      } else {
        createUnifiedField.clearPreview();
      }
    }

    function mountCreateMediaField() {
      var host = document.getElementById('createMediaMount');
      if (!host || !window.LanternUnifiedMediaField) return;
      host.innerHTML = '';
      createUnifiedField = window.LanternUnifiedMediaField.mount(host, {
        allowImage: true,
        allowVideo: false,
        allowLink: false,
        emptyHelper: 'Add an optional photo for your post.',
        chooseLabel: 'Choose photo',
        onImageFile: function (file) {
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            createLocalImage.dataUrl = reader.result;
            createLocalImage.mime = file.type || 'image/png';
            createLocalImage.fileName = file.name || 'image.png';
            if (window.LanternMediaEdit) {
              window.LanternMediaEdit.setLocal(createMediaEdit, { kind: 'image', previewUrl: createLocalImage.dataUrl });
            }
            refreshCreateMediaPreview();
          };
          reader.readAsDataURL(file);
        },
        onClear: function () {
          createLocalImage = { dataUrl: '', mime: 'image/png', fileName: 'image.png' };
          if (window.LanternMediaEdit) window.LanternMediaEdit.clear(createMediaEdit);
          refreshCreateMediaPreview();
        }
      });
      host.addEventListener('click', function (e) {
        var action = e.target && e.target.getAttribute && e.target.getAttribute('data-media-edit');
        if (!window.LanternMediaEdit) return;
        if (action === 'remove') {
          window.LanternMediaEdit.setRemove(createMediaEdit);
          createLocalImage = { dataUrl: '', mime: 'image/png', fileName: 'image.png' };
          refreshCreateMediaPreview();
        } else if (action === 'replace') {
          if (createUnifiedField && createUnifiedField.openFilePicker) createUnifiedField.openFilePicker();
        } else if (action === 'undo') {
          window.LanternMediaEdit.cancel(createMediaEdit);
          createLocalImage = { dataUrl: '', mime: 'image/png', fileName: 'image.png' };
          refreshCreateMediaPreview();
        } else if (action === 'use') {
          if (createUnifiedField && createUnifiedField.openFilePicker) createUnifiedField.openFilePicker();
        }
      });
      refreshCreateMediaPreview();
    }

    function applyFeedRevisionHydrate(item) {
      if (!item) return;
      if (item.type && document.getElementById('createType')) document.getElementById('createType').value = item.type;
      if (item.title && document.getElementById('createTitle')) document.getElementById('createTitle').value = item.title;
      if ((item.body || item.summary) && document.getElementById('createBody')) {
        document.getElementById('createBody').value = item.body || item.summary;
      }
      var note = item.private_feedback || '';
      if (note) setStatus('Teacher feedback: ' + note);
      if (window.LanternMediaEdit && item.image_url) {
        window.LanternMediaEdit.setExisting(createMediaEdit, {
          kind: 'image',
          previewUrl: item.image_url,
          deliveryUrl: item.image_url,
          objectKey: item.image_r2_key || ''
        });
        refreshCreateMediaPreview();
      }
    }

    try {
      var typeParam = new URLSearchParams(location.search || '').get('type');
      var typeEl = document.getElementById('createType');
      if (typeParam && typeEl) {
        var allowed = { article: 1, news: 1, photo: 1, video: 1, shout_out: 1, achievement: 1 };
        if (allowed[typeParam]) typeEl.value = typeParam;
      }
    } catch (e) {}

    mountCreateMediaField();

    (function bootFeedResubmit() {
      var rid = '';
      var stored = null;
      try {
        rid = (new URLSearchParams(location.search || '').get('resubmit') || '').trim();
        stored = JSON.parse(sessionStorage.getItem('LANTERN_FEED_RESUBMIT') || 'null');
        if (stored) sessionStorage.removeItem('LANTERN_FEED_RESUBMIT');
      } catch (e) {}
      if (!rid && stored && stored.id) rid = String(stored.id);
      if (!rid) return;
      isFeedResubmit = true;
      draftId = rid;
      if (stored) {
        applyFeedRevisionHydrate(stored);
      }
      if (feed && typeof feed.getRevision === 'function') {
        feed.getRevision(rid).then(function (res) {
          if (res && res.ok && res.item) applyFeedRevisionHydrate(res.item);
        }).catch(function () {});
      }
      var subBtn = document.getElementById('submitReviewBtn');
      if (subBtn) subBtn.textContent = 'Resubmit for teacher review';
    })();

    function mediaFieldsForPayload() {
      var intent = (createMediaEdit && createMediaEdit.intent) || 'keep';
      var out = { media_action: intent };
      if (intent === 'replace' && createLocalImage.dataUrl) {
        out.image = createLocalImage.dataUrl;
        out.mime_type = createLocalImage.mime;
        out.file_name = createLocalImage.fileName;
      }
      return out;
    }

    function payload() {
      return Object.assign({
        type: document.getElementById('createType').value,
        title: document.getElementById('createTitle').value.trim(),
        body: document.getElementById('createBody').value.trim()
      }, mediaFieldsForPayload());
    }

    document.getElementById('saveDraftBtn').addEventListener('click', function () {
      if (!feed) return;
      var p = payload();
      if (!p.title) { setStatus('Title required.'); return; }
      var req = draftId ? feed.update(Object.assign({ id: draftId }, p)) : feed.create(p);
      req.then(function (res) {
        if (!res || !res.ok) { setStatus((res && res.error) || 'Save failed.'); return; }
        draftId = res.id || draftId;
        if (window.LanternMediaEdit && createMediaEdit.intent === 'replace' && res.image_r2_key) {
          window.LanternMediaEdit.setExisting(createMediaEdit, {
            kind: 'image',
            previewUrl: '/api/news/image?key=' + encodeURIComponent(res.image_r2_key),
            deliveryUrl: '/api/news/image?key=' + encodeURIComponent(res.image_r2_key),
            objectKey: res.image_r2_key
          });
          createLocalImage = { dataUrl: '', mime: 'image/png', fileName: 'image.png' };
          createMediaEdit.intent = 'keep';
          refreshCreateMediaPreview();
        }
        setStatus('Draft saved.');
      });
    });

    mountCreateMediaField();

    if (window.LanternWritingQuality) {
      var createBodyEl = document.getElementById('createBody');
      var createTitleEl = document.getElementById('createTitle');
      window.LanternWritingQuality.loadSettings().then(function () {
        window.LanternWritingQuality.attachFields([
          { el: createTitleEl, profile: window.LanternWritingQuality.FIELD_PROFILES.SHORT_FORM },
          { el: createBodyEl, profile: window.LanternWritingQuality.FIELD_PROFILES.LONG_FORM },
        ]);
      });
    }

    function doSubmitReview() {
      if (!feed) return;
      var p = payload();
      if (!p.title || !p.body) { setStatus('Title and body required.'); return; }
      var chain = draftId
        ? feed.update(Object.assign({ id: draftId }, p)).then(function () { return feed.submit(draftId); })
        : feed.create(p).then(function (res) {
            if (!res || !res.ok) return res;
            draftId = res.id;
            return feed.submit(draftId);
          });
      chain.then(function (res) {
        if (!res || !res.ok) { setStatus((res && res.error) || 'Submit failed.'); return; }
        setStatus(isFeedResubmit ? 'Resubmitted for review' : 'Submitted for teacher review!');
        isFeedResubmit = false;
        if (window.LanternActionCounts) window.LanternActionCounts.refresh({ force: true });
      });
    }

    document.getElementById('submitReviewBtn').addEventListener('click', function () {
      if (!feed) return;
      var p = payload();
      if (!p.title || !p.body) { setStatus('Title and body required.'); return; }
      if (window.LanternWritingQuality) {
        window.LanternWritingQuality.loadSettings().then(function () {
          window.LanternWritingQuality.runBeforeSubmitFields([
            { text: p.title, profile: window.LanternWritingQuality.FIELD_PROFILES.SHORT_FORM, label: 'Title' },
            { text: p.body, profile: window.LanternWritingQuality.FIELD_PROFILES.LONG_FORM, label: 'Body' },
          ], doSubmitReview, { focusEl: document.getElementById('createBody') });
        });
        return;
      }
      doSubmitReview();
    });

    document.getElementById('triviaDraftBtn').addEventListener('click', function () {
      if (!feed) return;
      var body = {
        question: document.getElementById('triviaQ').value.trim(),
        correct_answer: document.getElementById('triviaCorrect').value.trim(),
        wrong_answer_1: document.getElementById('triviaWrong1').value.trim(),
        wrong_answer_2: document.getElementById('triviaWrong2').value.trim(),
        wrong_answer_3: document.getElementById('triviaWrong3').value.trim()
      };
      feed.triviaCreate(body).then(function (res) {
        if (!res || !res.ok) { setTriviaStatus((res && res.error) || 'Failed.'); return; }
        triviaId = res.id;
        setTriviaStatus('Trivia draft saved.');
      });
    });

    document.getElementById('triviaSubmitBtn').addEventListener('click', function () {
      if (!feed || !triviaId) {
        setTriviaStatus('Save a trivia draft first.');
        return;
      }
      feed.triviaSubmit(triviaId).then(function (res) {
        if (!res || !res.ok) { setTriviaStatus((res && res.error) || 'Submit failed.'); return; }
        setTriviaStatus('Trivia submitted for review!');
      });
    });
  })();
  </script>
</body>
</html>

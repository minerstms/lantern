<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/assets/favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base target="_top" />
  <title>Sign in | Lantern</title>
  <script>window.LANTERN_AVATAR_API = '';</script>
  <script src="js/lantern-pilot-auth.js"></script>
  <script>
  (function () {
    try {
      var q = typeof location !== 'undefined' ? (location.search || '') : '';
      if (/[?&]noLockerRedirect=1(?:&|$)/.test(q)) return;
      var path = (typeof location !== 'undefined' && location.pathname) ? location.pathname : '/';
      path = path.replace(/\/$/, '') || '/';
      if (path !== '/') return;

      var auth = window.LanternAuth || window.LanternPilotAuth;
      // Prompt #196 — root must not dump staff into a Locker-titled dead-end.
      // Authenticated: role home (teacher/admin → Teacher Tools). Unauthenticated: login
      // WITHOUT return=/ so post-login uses defaultRoleHomePath (not Locker / root).
      function goLogin() {
        location.replace('/login.html');
      }
      function roleHome(role) {
        if (auth && typeof auth.defaultRoleHomePath === 'function') {
          return auth.defaultRoleHomePath(role);
        }
        var r = String(role || '').trim().toLowerCase();
        if (r === 'admin') return '/admin.html';
        if (r === 'teacher') return '/teacher';
        return '/explore.html';
      }
      if (auth && typeof auth.fetchMe === 'function') {
        auth.fetchMe().then(function (data) {
          if (data && data.ok && data.authenticated) {
            if (data.must_change_password) {
              location.replace('/change-password.html?return=' + encodeURIComponent('/teacher'));
              return;
            }
            location.replace(roleHome(data.role));
            return;
          }
          goLogin();
        }).catch(function () {
          goLogin();
        });
        return;
      }
      goLogin();
    } catch (e) {}
  })();
  </script>
</head>
<body style="margin:0;background:#0b1220;color:#eaf0ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;">
  <p style="font-size:28px;padding:20px 16px;margin:0;">Loading…</p>
  <p style="font-size:22px;padding:0 16px 24px;margin:0;">
    <a id="indexLoginContinue" href="/login.html" style="color:#5aa7ff;font-weight:800;">Continue</a>
  </p>
</body>
</html>

<!DOCTYPE html>
<html class="lantern-pilot-auth-pending" lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/assets/favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>window.LANTERN_AVATAR_API = '';</script>
  <script src="js/lantern-pilot-auth.js?v=20260806-session"></script>
  <style>html.lantern-pilot-auth-pending body { visibility: hidden; }</style>
  <title>Lantern</title>
  <link rel="stylesheet" href="css/lantern-ticker.css">
  <link rel="stylesheet" href="css/lantern-header.css">
  <link rel="stylesheet" href="css/lantern-cards.css?v=20260813-openedmodal148">
  <link rel="stylesheet" href="css/lantern-feed.css?v=20260812-marquee137">
  <link rel="stylesheet" href="css/lantern-power-list.css?v=20260812-marquee137">
  <link rel="stylesheet" href="css/lantern-surface-theme.css?v=20260811-exploreheaderfilters">
  <link rel="stylesheet" href="css/lantern-reactions.css">
  <style>
    :root {
      --bg: #0b1220;
      --ink: #eaf0ff;
      --muted: #b9c6ea;
      --line: rgba(255, 255, 255, 0.12);
    }
    html, body { margin: 0; min-height: 100%; }
    body {
      /* Page background: lantern-header.css --lantern-page-bg (Prompt #156) */
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 22px;
    }
    a { color: inherit; text-decoration: none; }
  </style>
</head>
<body class="page-has-ticker">
  <script>
  (function () {
    var auth = window.LanternAuth || window.LanternPilotAuth;
    if (!auth || typeof auth.guardPilotPage !== 'function') {
      location.replace('/login.html?return=' + encodeURIComponent(location.pathname + location.search));
      return;
    }
    auth.guardPilotPage({ mode: 'general' }, function (data) {
      window.LANTERN_PILOT_ME = data;
      if (auth.applyStudentStorageFromSession) auth.applyStudentStorageFromSession(data);
      document.documentElement.classList.remove('lantern-pilot-auth-pending');
    });
  })();
  </script>
  <script src="js/lantern-canonical-route-boot.js"></script>
  <div id="lanternHeader">
    <div id="lanternTicker"></div>
    <div id="lanternAppBarRoot"></div>
  </div>
  <div class="wrap lanternContent lanternContent--feedWide">
    <div id="classAccessBannerEl"></div>
    <div id="classAccessGateWrap" style="display:none;position:fixed;inset:0;z-index:9999;background:#0b1220;overflow:auto;padding:24px;"></div>
    <div id="classAccessContentWrap" style="visibility:hidden;opacity:0;">
      <main class="lanternExploreSurface" data-surface-context="explore" data-help="explore">
      <div class="lanternExplorePageContainer">
      <!-- Prompt #187 — body title / count / Filters control removed; Filters lives in Explore header. -->
      <header class="feedHeading feedHeading--exploreHeaderFilters" aria-label="Feed filters">
        <div id="feedFiltersPanel" class="feedFiltersPanel" hidden>
          <div class="feedFiltersToolbarRow">
            <select id="feedSortSelect" class="feedSortSelect" aria-label="Sort feed">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="title">Title A–Z</option>
            </select>
            <button type="button" id="feedRefreshBtn" class="feedToolbarBtn">Refresh</button>
          </div>
          <div id="feedFilterBar" class="feedFilterBar" role="toolbar" aria-label="Category filters"></div>
        </div>
      </header>
      <div class="feedResultsHost">
        <div id="feedEmpty" class="feedEmpty" hidden>No approved items match your filters yet. Try All or create something new.</div>
        <div id="feedGrid" class="feedGrid" role="feed" aria-label="Lantern feed"></div>
        <div id="feedLoadMoreWrap" class="feedLoadMoreWrap" hidden>
          <button type="button" id="feedLoadMoreBtn" class="feedLoadMoreBtn">Load More</button>
          <p id="feedLoadMoreStatus" class="feedLoadMoreStatus" aria-live="polite"></p>
        </div>
      </div>
      </div>
      </main>
    </div>
  </div>
  <div id="feedDetailOverlay" class="feedDetailOverlay" hidden>
    <div class="feedDetailPanel">
      <h2 class="feedDetailTitle"></h2>
      <img class="feedDetailImg" alt="" style="display:none">
      <div class="feedDetailSlotHost"></div>
      <p class="feedDetailBody"></p>
      <div class="feedDetailReactionsHost"></div>
      <div class="feedDetailCommentsHost"></div>
      <div class="feedDetailTeacherTools"></div>
      <button type="button" class="feedDetailClose feedDetailCloseBtn" onclick="document.getElementById('feedDetailOverlay').hidden=true">Close</button>
    </div>
  </div>
  <div id="marqueeFeedInspector" class="marqueeFeedOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="marqueeFeedTitle">
    <div class="marqueeFeedPanel">
      <div class="marqueeFeedPanelHd">
        <h2 id="marqueeFeedTitle">Marquee Feed</h2>
        <button type="button" class="marqueeFeedCloseBtn" id="marqueeFeedCloseBtn">Close</button>
      </div>
      <p class="marqueeFeedHint">Read-only. Newest first. Same events the public ticker can show.</p>
      <div id="marqueeFeedListMount"></div>
    </div>
  </div>
  <script src="js/class-access.js"></script>
  <script src="js/lantern-staff-nav.js"></script>
  <script src="js/lantern-nav.js?v=20260812-marquee137"></script>
  <script src="js/lantern-help.js"></script>
  <script src="js/lantern-avatar.js"></script>
  <script src="js/lantern-ticker.js"></script>
  <script src="js/lantern-cards.js"></script>
  <script src="js/lantern-media.js"></script>
  <script src="js/lantern-card-ui.js"></script>
  <script src="js/lantern-final-reactions.js"></script>
  <script src="js/lantern-canonical-enforce.js"></script>
  <script src="js/lantern-feed-api.js"></script>
  <script src="js/lantern-feed-card.js"></script>
  <script src="js/lantern-surface-theme.js?v=20260808-feedlayout"></script>
  <script src="js/lantern-feed-explore.js?v=20260811-exploreheaderfilters"></script>
  <script src="js/lantern-power-list.js?v=20260812-marquee137"></script>
  <script src="js/lantern-marquee-inspector.js?v=20260812-marquee137"></script>
  <script>
  (function () {
    function boot() {
      if (window.LANTERN_FEED_EXPLORE) window.LANTERN_FEED_EXPLORE.init();
    }
    document.addEventListener('lantern-class-access-resolved', boot);
    if (document.getElementById('classAccessContentWrap') && getComputedStyle(document.getElementById('classAccessContentWrap')).visibility === 'visible') {
      boot();
    }
  })();
  </script>
</body>
</html>

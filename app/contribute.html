<!-- ===== TMS Lantern — Contribute (Share News or Complete a Mission) ===== -->
<!DOCTYPE html>
<html class="lantern-pilot-auth-pending">
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/assets/favicon.png?v=2">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>window.LANTERN_AVATAR_API = '';</script>
  <script src="js/lantern-pilot-auth.js"></script>
  <style>html.lantern-pilot-auth-pending body { visibility: hidden; }</style>
  <title>Create | Lantern</title>
  <link rel="stylesheet" href="css/lantern-ticker.css">
  <link rel="stylesheet" href="css/lantern-header.css">
  <link rel="stylesheet" href="css/lantern-rails.css">
  <link rel="stylesheet" href="css/lantern-cards.css?v=20260812-openedmodal9">
  <link rel="stylesheet" href="css/lantern-reactions.css">
  <link rel="stylesheet" href="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.css">
  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f1b33;
      --ink:#eaf0ff;
      --muted:#b9c6ea;
      --accent:#5aa7ff;
      --good:#38d07c;
      --bad:#ff4d6d;
      --line: rgba(255,255,255,.12);
      --r: 18px;
      --shadow: 0 12px 28px rgba(0,0,0,.35);
      --fsBase: 22px;
    }
    *{box-sizing:border-box}
    html,body{ min-height: 100%; margin: 0; }
    body{
      /* Page background: lantern-header.css --lantern-page-bg (Prompt #156) */
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: var(--fsBase);
      overflow-x: hidden;
    }
    a{color:inherit}
    /* Outer shell: lantern-header.css .wrap.lanternContent (same max-width + gutters as Lantern / Locker / Play) */
    .wrap.lanternContent{ position: relative; }
    /*
     * Top chrome is NOT authored here — it is injected by js/lantern-nav.js into #lanternAppBarRoot (same as explore.html).
     * Scope ALL form-field rules to .wrap.lanternContent so unscoped input[type="text"] cannot override the pill search
     * (.lanternAppBarSearchInput) in the shared app bar.
     */
    .card{
      margin-top: 8px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .cardHd{ padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; }
    .cardHd .h{ font-weight: 900; font-size: 26px; letter-spacing: .2px; }
    .cardBd{ padding: 16px; }
    #contributeUnifiedBd.cardBd{ padding: 10px 12px 12px; }
    /*
     * Prompt #157 — Create form-control contract (ONE visual system).
     * Labels stay prominent; control CONTENT uses ordinary readable typography.
     * Form input prominence != published card / "When opened" preview typography.
     */
    :root{
      --create-control-fs: 22px;
      --create-control-fw: 400;
      --create-control-lh: 1.35;
      --create-control-pad-y: 12px;
      --create-control-pad-x: 14px;
      --create-control-radius: 14px;
      --create-control-border: 1px solid var(--line);
      --create-control-bg: rgba(0,0,0,.25);
      --create-control-color: var(--ink);
      --create-control-placeholder: rgba(185,198,234,.72);
      --create-control-focus-border: rgba(56,208,124,.65);
      --create-control-focus-ring: 0 0 0 3px rgba(56,208,124,.2);
      --create-textarea-min-h: 160px;
      --create-textarea-lh: 1.5;
    }
    .wrap.lanternContent label{ display: block; font-weight: 800; color: var(--muted); font-size: 22px; margin: 0 0 6px 2px; }
    .wrap.lanternContent input[type="text"],
    .wrap.lanternContent select,
    .wrap.lanternContent textarea,
    .wrap.lanternContent input[type="url"],
    .wrap.lanternContent input.pollOptInput,
    .wrap.lanternContent input.studioHeadlineInput,
    .wrap.lanternContent textarea.studioBodyInput{
      width: 100%;
      box-sizing: border-box;
      padding: var(--create-control-pad-y) var(--create-control-pad-x);
      border-radius: var(--create-control-radius);
      border: var(--create-control-border);
      background: var(--create-control-bg);
      color: var(--create-control-color);
      font-size: var(--create-control-fs);
      font-weight: var(--create-control-fw);
      line-height: var(--create-control-lh);
      font-family: inherit;
    }
    .wrap.lanternContent input[type="text"]::placeholder,
    .wrap.lanternContent input[type="url"]::placeholder,
    .wrap.lanternContent textarea::placeholder,
    .wrap.lanternContent input.studioHeadlineInput::placeholder,
    .wrap.lanternContent textarea.studioBodyInput::placeholder,
    .wrap.lanternContent input.pollOptInput::placeholder{
      color: var(--create-control-placeholder);
      font-size: var(--create-control-fs);
      font-weight: var(--create-control-fw);
      opacity: 1;
    }
    .wrap.lanternContent textarea,
    .wrap.lanternContent textarea.studioBodyInput{
      min-height: var(--create-textarea-min-h);
      resize: vertical;
      line-height: var(--create-textarea-lh);
    }
    #contributeUnifiedBd input[type="text"]:focus,
    #contributeUnifiedBd input[type="url"]:focus,
    #contributeUnifiedBd select:focus,
    #contributeUnifiedBd textarea:focus,
    #contributeUnifiedBd input.studioHeadlineInput:focus,
    #contributeUnifiedBd textarea.studioBodyInput:focus,
    #contributeUnifiedBd input.pollOptInput:focus{
      outline: none;
      border-color: var(--create-control-focus-border);
      box-shadow: var(--create-control-focus-ring);
    }
    #contributeUnifiedBd input:disabled,
    #contributeUnifiedBd select:disabled,
    #contributeUnifiedBd textarea:disabled{
      opacity: .55;
      cursor: not-allowed;
    }
    .btn{
      height: 56px;
      padding: 0 24px;
      border-radius: 14px;
      border: 2px solid rgba(90,167,255,.4);
      background: linear-gradient(180deg, rgba(90,167,255,.2), rgba(90,167,255,.08));
      color: var(--ink);
      font-weight: 900;
      font-size: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .btn:active{ transform: translateY(1px); }
    .btn.good{ border-color: rgba(56,208,124,.5); background: linear-gradient(180deg, rgba(56,208,124,.25), rgba(56,208,124,.1)); }
    .btn.small{ padding: 6px 14px; font-size: 20px; height: auto; }
    .btn.bad{ border-color: rgba(255,77,109,.5); background: linear-gradient(180deg, rgba(255,77,109,.2), rgba(255,77,109,.08)); }
    .btn:disabled{ opacity: .5; cursor: not-allowed; filter: grayscale(0.4); }
    .chooserGrid{ display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 12px; }
    .chooserCard{
      padding: 32px 24px;
      border-radius: var(--r);
      border: 2px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      text-align: center;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .chooserCard:hover{ transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); border-color: var(--accent); }
    .chooserCard .icon{ font-size: 48px; margin-bottom: 12px; }
    .chooserCard .title{ font-weight: 900; font-size: 28px; margin-bottom: 8px; }
    .chooserCard .sub{ color: var(--muted); font-size: 22px; }
    .toast{
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border-radius: 14px;
      background: rgba(0,0,0,.85);
      color: var(--ink);
      font-weight: 900;
      font-size: 22px;
      z-index: 9998;
      display: none;
    }
    .newsImageDrop{ border: 2px dashed var(--line); border-radius: 14px; padding: 16px; background: rgba(0,0,0,.2); min-height: 100px; }
    .newsImagePlaceholder{ color: var(--muted); font-size: 22px; text-align: center; padding: 20px; cursor: pointer; }
    .newsImagePreviewWrap{ text-align: center; }
    .newsImagePreviewWrap img{ max-width: 100%; max-height: 240px; border-radius: 12px; display: block; margin: 0 auto 10px; }
    .newsImageActions{ display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .cropperModal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .cropperModal .cropperBox{ background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; max-width: 100%; max-height: 90vh; overflow: auto; }
    .cropperModal .cropperTitle{ font-weight: 900; font-size: 26px; margin-bottom: 14px; }
    .cropperModal .cropperImgWrap{ max-height: 60vh; margin: 0 auto 14px; background: #000; border-radius: 10px; overflow: hidden; }
    .cropperModal .cropperImgWrap img{ max-width: 100%; display: block; }
    .cropperModal .cropperActions{ display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    /* Mission picker: same lane label grammar as explore.html (sectionSubLane + .lanternScroller) */
    .sectionSubLane{ font-size: 20px; font-weight: 800; margin-bottom: 8px; margin-top: 0; padding: 4px 0 0; line-height: 1.35; color: var(--muted); }
    .sectionPlaceholder{ color: var(--muted); font-size: 22px; padding: 12px 0; }
    .overlay{ position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .overlay.show{ display: flex; }
    .modal{ background: var(--panel); border-radius: var(--r); padding: 20px; max-width: 480px; width: 100%; border: 1px solid var(--line); max-height: 90vh; overflow: auto; }
    .modalHd{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modalHd .h{ font-weight: 1000; font-size: 26px; }
    .modalHd .x{ background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 4px; }
    .missionCropperModal{ position: fixed; inset: 0; z-index: 10001; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .missionCropperModal .missionCropperBox{ background: var(--panel); border-radius: var(--r); padding: 20px; max-width: 100%; width: 100%; max-width: 520px; border: 1px solid var(--line); }
    .missionCropperModal .missionCropperTitle{ font-weight: 900; font-size: 26px; margin-bottom: 14px; }
    .missionCropperModal .missionCropperImgWrap{ max-height: 60vh; margin: 0 auto 14px; background: #000; border-radius: 10px; overflow: hidden; }
    .missionCropperModal .missionCropperImgWrap img{ max-width: 100%; display: block; }
    .missionCropperModal .missionCropperActions{ display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .missionSubmitImageDrop{ border: 2px dashed var(--line); border-radius: var(--r); background: rgba(0,0,0,.2); padding: 16px; margin-top: 8px; margin-bottom: 8px; }
    .missionSubmitImagePlaceholder{ cursor: pointer; font-size: 22px; font-weight: 800; color: var(--muted); text-align: center; padding: 12px 0; }
    .missionSubmitImageDrop.dragover{ border-color: var(--accent); background: rgba(90,167,255,.08); }
    .missionSubmitImagePreviewWrap{ margin-top: 8px; }
    .missionSubmitImagePreviewWrap img{ max-height: 200px; max-width: 100%; border-radius: 12px; display: block; }
    .missionSubmitImageActions{ margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .missionMediaPreviewWrap{ margin-top: 10px; }
    .missionVideoPreview video{ max-height: 360px; max-width: 100%; border-radius: 12px; display: block; }
    .missionLinkPreviewCard{ margin-top: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.2); font-size: 20px; }
    .missionLinkPreviewCard a{ font-weight: 800; word-break: break-all; }

    .contributeNewsInner{ display: flex; gap: 24px; flex-wrap: wrap; margin-top: 12px; }
    .contributeNewsFormCol{ flex: 1 1 320px; min-width: 0; }
    .contributeNewsPreviewCol{ flex: 0 0 320px; min-width: 280px; }
    @media (max-width: 700px){ .contributeNewsPreviewCol{ flex: 1 1 100%; } }
    .contributeNewsPreviewLabel{ font-weight: 900; font-size: 22px; color: var(--muted); margin-bottom: 10px; }
    .contributeNewsPreviewCard{ min-height: 120px; }
    .newsItem{ padding: 18px; margin-bottom: 0; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); }
    .newsItem .newsTitle{ font-weight: 900; font-size: 26px; line-height: 1.2; margin-bottom: 8px; }
    .newsItem .newsBody{ font-size: 22px; line-height: 1.45; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
    .newsItem .newsMeta{ font-size: 20px; color: var(--muted); margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .newsItem .newsByline{
      font-size: var(--lantern-card-identity-name-size, 22px);
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--lantern-card-identity-gap, 12px);
    }
    .newsItem .authorBadge{ display: inline-block; padding: 6px 12px; border-radius: 8px; font-weight: 900; font-size: 18px; }
    .newsItem .authorBadge.student{ background: rgba(90,167,255,.2); border: 1px solid rgba(90,167,255,.4); }
    .newsItem .authorBadge.teacher{ background: rgba(56,208,124,.2); border: 1px solid rgba(56,208,124,.4); }
    .newsItem .authorBadge.staff{ background: rgba(156,100,255,.2); border: 1px solid rgba(156,100,255,.4); }
    .newsItem .authorBadge.admin{ background: rgba(242,194,48,.2); border: 1px solid rgba(242,194,48,.4); }
    .newsItem .newsCategory{ font-weight: 800; color: var(--accent); }
    .newsItem .newsCardImageWrap{ margin-bottom: 12px; }
    .newsItem .newsCardImage{ max-width: 100%; height: auto; border-radius: 12px; display: block; }
    .newsItem .newsCardVideoWrap video{ max-width: 100%; max-height: 200px; border-radius: 12px; border: 1px solid var(--line); }
    .newsItem .newsCardLinkWrap{ padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(0,0,0,.2); margin-bottom: 12px; }
    .missionSubmitPreviewWrap{ margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .missionSubmitPreviewLabel{ font-weight: 900; font-size: 22px; color: var(--muted); margin-bottom: 10px; }
    .studioShell{
      border-radius: var(--r);
      padding: 10px;
      margin-top: 6px;
      transition: box-shadow .35s ease, background .4s ease;
      --completion: 0;
    }
    .studioShell[data-completion="0"]{ box-shadow: 0 0 0 1px rgba(255,255,255,.06); }
    .studioShell[data-completion="1"]{ box-shadow: 0 0 20px rgba(90,167,255,.12); }
    .studioShell[data-completion="2"]{ box-shadow: 0 0 28px rgba(90,167,255,.2); }
    .studioShell[data-completion="3"]{ box-shadow: 0 0 36px rgba(56,208,124,.18); }
    .studioShell.studio-ready-pulse{ animation: studioReadyBloom .9s ease-out; }
    @keyframes studioReadyBloom{
      0%{ box-shadow: 0 0 20px rgba(56,208,124,.3); }
      50%{ box-shadow: 0 0 48px rgba(56,208,124,.45); }
      100%{ box-shadow: 0 0 24px rgba(90,167,255,.15); }
    }
    .studioSparkleHost{ position: relative; }
    .studioSparkle{
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,.85); pointer-events: none; opacity: 0;
      animation: studioSparklePop .7s ease-out forwards;
    }
    @keyframes studioSparklePop{
      0%{ opacity: 0; transform: scale(0); }
      30%{ opacity: 1; transform: scale(1.2); }
      100%{ opacity: 0; transform: scale(0.3) translateY(-20px); }
    }
    /* 3-panel studio: breakout at #contributeWriteWrap so overflow:hidden ancestors do not clip side panes */
    .containerStudio3Panel.studioThreeCols{
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: stretch;
    }
    /* Contribute Studio: base stacked; fine-pointer desktop canvas (zoom-safe, clips sides) */
    .contributeCenterInner{
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .contributeMediaRow{
      margin-top: 0;
      padding-bottom: 4px;
    }
    .contributeCenterRow2{
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px 14px;
      align-items: start;
      min-width: 0;
    }
    .contributeCreateFullRow{
      grid-column: 1 / -1;
      min-width: 0;
    }
    @media (min-width: 720px){
      .contributeCenterRow2{ grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    }
    .contributeSlotLeft,
    .contributeSlotRight{
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .missionSelectedMeta{
      font-size: 20px;
      line-height: 1.35;
    }
    /* Mission flow: State A = full-width picker rail only; State B = meta + response (no center rail) */
    .missionPickerState{
      display: none;
      grid-column: 1 / -1;
      width: 100%;
      min-width: 0;
      margin-bottom: 6px;
    }
    .contributeMainStudioRow.mission-flow-pick .contributeSlotLeft,
    .contributeMainStudioRow.mission-flow-pick .contributeSlotRight{
      display: none !important;
    }
    .contributeMainStudioRow.mission-flow-respond .missionPickerState{
      display: none !important;
    }
    /* Card-parity: title → identity/category → body (matches opened news card order) */
    #contributeNewsTitleBlock{
      margin-bottom: 0;
    }
    #contributePostIdentityAuthor,
    #contributePostIdentityCategory{
      margin-bottom: 0;
    }
    /* Primary body: compact but readable; typography still matches --create-control-* */
    #contributeUnifiedBd textarea.studioBodyInput{
      min-height: 120px;
    }
    #contributeUnifiedBd #profilePostCaption.studioBodyInput{
      min-height: 88px;
    }
    .contributeVariantFullRow{
      grid-column: 1 / -1;
    }
    @media (max-width: 720px){
      .contributeCenterRow2{ grid-template-columns: 1fr; }
      .contributeVariantFields2col,
      .contributeVariantShout2col{ grid-template-columns: 1fr; }
    }
    .studioColLeft .studioSidePanelBd{
      align-items: stretch;
    }
    /* Stacked Studio: touch/coarse + narrow viewport — CREATE first, then stream, then opened */
    @media ((hover: none) or (pointer: coarse)) and (max-width: 1199px){
      #contributeWriteWrap{
        width: auto;
        max-width: none;
        margin-left: 0;
        margin-right: 0;
        padding-left: 0;
        padding-right: 0;
        overflow-x: visible;
      }
      .containerStudio3Panel.studioThreeCols .studioColCenter{ order: -1; width: 100%; }
      .containerStudio3Panel.studioThreeCols .studioColLeft{ order: 0; width: 100%; }
      .containerStudio3Panel.studioThreeCols .studioColRight{ order: 1; width: 100%; }
      .studioColLeft,
      .studioColRight,
      .studioColCenter{
        position: static;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin-left: 0;
      }
    }
    /*
     * Desktop Studio canvas (fine pointer, any width):
     * Create RIGHT edge = 50vw + --lantern-studio-center-right-half + --lantern-studio-center-right-extend.
     * #110 grew Create LEFT (gap-correct inset). #111 also grows Create RIGHT via right-extend;
     * Feed (.studioColLeft) still keys off center-width + right-half only — left edge / Feed gap unchanged.
     * Below 1280px: width 640px, right-extend 0 (legacy centered geometry).
     * At 1280px+: width 760px + inset gap-correct + right-extend; "When opened" shifts right with Create.
     */
    @media (hover: hover) and (pointer: fine){
      :root{
        --lantern-studio-center-right-half: 320px;
        --lantern-studio-center-right-extend: 0px;
      }
      #contributeWriteWrap{
        width: 100vw;
        max-width: 100vw;
        margin-left: calc(50% - 50vw);
        margin-right: calc(50% - 50vw);
        padding-left: max(var(--lantern-pad-x), env(safe-area-inset-left, 0px));
        padding-right: max(var(--lantern-pad-x), env(safe-area-inset-right, 0px));
        box-sizing: border-box;
        overflow-x: clip;
      }
      #creationStudioShell{
        width: 100%;
        max-width: none;
        margin-left: 0;
        margin-right: 0;
        overflow-x: clip;
      }
      .containerStudio3Panel.studioThreeCols{
        display: block;
        position: relative;
        width: 100%;
        margin-left: 0;
        margin-right: 0;
        padding-left: 0;
        padding-right: 0;
        box-sizing: border-box;
      }
      .studioColCenter{
        position: relative;
        z-index: 1;
        width: var(--lantern-studio-center-render-width, var(--lantern-studio-center-width));
        min-width: var(--lantern-studio-center-render-width, var(--lantern-studio-center-width));
        max-width: var(--lantern-studio-center-render-width, var(--lantern-studio-center-width));
        /* + right-extend cancels the extend baked into render-width so Create's LEFT stays at the #110 edge. */
        margin-left: calc(50vw + var(--lantern-studio-center-right-half) - var(--lantern-studio-center-render-width, var(--lantern-studio-center-width)) + var(--lantern-studio-center-right-extend, 0px));
        margin-right: 0;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: visible;
      }
      .studioColLeft{
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: calc(50vw - var(--lantern-studio-center-right-half) + var(--lantern-studio-center-width) + var(--lantern-studio-col-gap));
        width: auto;
        min-width: 0;
        max-width: none;
        overflow-x: hidden;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .studioColRight{
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(50vw + var(--lantern-studio-center-right-half) + var(--lantern-studio-center-right-extend, 0px) + var(--lantern-studio-col-gap));
        right: 0;
        width: auto;
        min-width: 0;
        max-width: none;
        overflow-x: hidden;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      /* RIGHT panel: card fits inside — no internal horizontal scroll */
      .studioColRight .studioSidePanelBd--preview{
        align-items: center;
        overflow-x: hidden;
        overflow-y: visible;
      }

  <script>
    (function(){ try { if (window.LANTERN_DATA) { if (window.LANTERN_DATA.ensureCharacters) window.LANTERN_DATA.ensureCharacters(); if (window.LANTERN_DATA.ensureCatalog) window.LANTERN_DATA.ensureCatalog(); } } catch(e){} })();
    var createRun = (typeof LANTERN_API !== 'undefined' && LANTERN_API.createRun) ? LANTERN_API.createRun : null;
    var LS_ADOPTED = 'LANTERN_ADOPTED_CHARACTER';
    var newsApiBase = (typeof window !== 'undefined' && typeof window.LANTERN_AVATAR_API !== 'undefined' && window.LANTERN_AVATAR_API !== null) ? String(window.LANTERN_AVATAR_API).replace(/\/$/, '') : null;
    var missionsApiBase = (function () {
      if (typeof window === 'undefined') return null;
      var raw =
        typeof window.LANTERN_AVATAR_API !== 'undefined' && window.LANTERN_AVATAR_API !== null
          ? window.LANTERN_AVATAR_API
          : window.LANTERN_ECONOMY_API;
      if (typeof raw === 'undefined' || raw === null) return null;
      return String(raw).replace(/\/$/, '');
    })();

    var el = function(id){ return document.getElementById(id); };
    var toastEl = el('toast');

    function getAdopted(){
      try {
        var auth = window.LanternAuth || window.LanternPilotAuth;
        if (auth && typeof auth.adoptedFromPilotMe === 'function') {
          var a = auth.adoptedFromPilotMe();
          if (a && a.name) return a;
        }
      } catch(e) {}
      return null;
    }

    var FERPA_STUDENT_SUBMIT_MESSAGE = 'Your teacher will review this before posting. Make sure it does not include personal details.';

    function toast(msg, durationMs){
      if (!toastEl) return;
      toastEl.textContent = msg;
      toastEl.style.display = 'block';
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(function(){ toastEl.style.display = 'none'; }, typeof durationMs === 'number' ? durationMs : 2400);
    }

    /* Studio stream grid helpers — used by updateStudioAll for LEFT preview */
    function getNewsAuthorLabel(type){
      if (window.LanternCardUI && typeof window.LanternCardUI.newsRoleLabelFromAuthorType === 'function') {
        return window.LanternCardUI.newsRoleLabelFromAuthorType(type);
      }
      if (type === 'student') return 'Student Reporter';
      if (type === 'teacher') return 'Teacher Contributor';
      if (type === 'staff') return 'Staff Announcement';
      if (type === 'admin') return 'Admin Update';
      return 'Student Reporter';
    }
    function appendStudioNewsCardNode(n, escFn, isActive){
      if (!window.LanternCards || !window.LanternCards.specNewsRailCard || !window.LanternCards.createStudentCard) return null;
      return window.LanternCards.createStudentCard(window.LanternCards.specNewsRailCard(n, escFn, getNewsAuthorLabel(n.author_type || 'student'), isActive));
    }
    function buildStudioPollCardNode(poll, options){
      if (!window.LanternCards || !window.LanternCards.specPollRailCard || !window.LanternCards.createStudentCard) return null;
      return window.LanternCards.createStudentCard(window.LanternCards.specPollRailCard(poll, options || {}));
    }
    function buildStudioFeedPostCardNode(p, options){
      if (!window.LanternCards || !window.LanternCards.materializeFeedPostCard) return null;
      var mode = window.LanternCards.CARD_MODE ? window.LanternCards.CARD_MODE.RAIL : 'rail';
      return window.LanternCards.materializeFeedPostCard(p, Object.assign({ mode: mode }, options || {}));
    }
    function renderStudioLeftDraft(draftCardEl, escFn){
      var host = el('studioStreamGrid');
      if (!host || !window.LANTERN_STUDIO_STREAM_GRID || typeof window.LANTERN_STUDIO_STREAM_GRID.mount !== 'function') return;
      window.LANTERN_STUDIO_STREAM_GRID.mount(host, draftCardEl, { esc: escFn });
    }

    /* Prompt #117 ARCHIVE: Profile post (Locker) creation retired from Create UI. Keep dormant
     * renderer/submit below for restore; never surface the mode via selector/deep-link/stale state. */
    var ARCHIVED_CONTRIBUTE_TYPES = { profile_post: true, profilepost: true, mission: true };
    var DEFAULT_CONTRIBUTE_TYPE = 'post';
    function normalizeContributeType(raw){
      var t = String(raw || '').trim().toLowerCase();
      if (!t) return DEFAULT_CONTRIBUTE_TYPE;
      if (ARCHIVED_CONTRIBUTE_TYPES[t]) return DEFAULT_CONTRIBUTE_TYPE;
      return t;
    }
    function getContributeType(){
      var sel = el('contributeTypeSelect');
      var raw = sel ? String(sel.value || '') : '';
      var t = normalizeContributeType(raw);
      if (sel && ARCHIVED_CONTRIBUTE_TYPES[String(raw || '').trim().toLowerCase()]) {
        sel.value = DEFAULT_CONTRIBUTE_TYPE;
      }
      return t || DEFAULT_CONTRIBUTE_TYPE;
    }
    /* Prompt #186 — session role is authoritative (not a Create dropdown). */
    function resolveSessionAuthorType(){
      try {
        var me = window.LANTERN_PILOT_ME;
        if (me && me.ok && me.authenticated !== false && me.role != null) {
          var r = String(me.role || '').trim().toLowerCase();
          if (r === 'teacher' || r === 'staff' || r === 'admin') return r;
          if (r === 'student') return 'student';
        }
        var auth = window.LanternAuth || window.LanternPilotAuth;
        if (auth && typeof auth.normalizeRole === 'function' && me && me.role != null) {
          var nr = auth.normalizeRole(me.role);
          if (nr === 'teacher' || nr === 'staff' || nr === 'admin') return nr;
          if (nr === 'student') return 'student';
        }
      } catch (e) {}
      return 'student';
    }
    function resolveSessionAuthorName(authorType){
      var at = String(authorType || resolveSessionAuthorType()).trim().toLowerCase();
      if (at === 'student') {
        var dn = getAdoptedPublicDisplayName();
        if (dn) return dn;
        var ad = getAdopted();
        return (ad && ad.name) ? String(ad.name).trim() : '';
      }
      try {
        var me = window.LANTERN_PILOT_ME;
        // Prompt #223 — content author preview uses public staff label; session header still uses display_name.
        if (me && me.public_staff_label) return String(me.public_staff_label).trim();
        if (me && me.display_name) return String(me.display_name).trim();
        if (me && me.username) return String(me.username).trim();
      } catch (e2) {}
      return at === 'admin' ? 'Admin' : at === 'staff' ? 'Staff' : 'Teacher';
    }

    function resetContributeFormPartial(){
      if (el('newsCategorySelect')) el('newsCategorySelect').value = '';
      if (el('contributeDerivedCategory')) el('contributeDerivedCategory').value = 'School News';
      if (el('contributeShoutReason')) el('contributeShoutReason').value = '';
      if (window.__lanternShoutPeoplePicker && typeof window.__lanternShoutPeoplePicker.clear === 'function') {
        window.__lanternShoutPeoplePicker.clear();
      }
      if (window.__lanternPeoplePicker && typeof window.__lanternPeoplePicker.clear === 'function') {
        window.__lanternPeoplePicker.clear();
      }
      if (el('newsTitle')) el('newsTitle').value = '';
      if (el('newsBody')) el('newsBody').value = '';
      if (el('newsPhotoCredit')) el('newsPhotoCredit').value = '';
      if (el('pollQuestion')) el('pollQuestion').value = '';
      if (el('pollFallbackSelect')) el('pollFallbackSelect').value = 'poll';
      if (el('newsAuthorType')) el('newsAuthorType').value = resolveSessionAuthorType();
      if (el('profilePostType')) el('profilePostType').value = 'link';
      if (el('profilePostTitle')) el('profilePostTitle').value = '';
      if (el('profilePostCaption')) el('profilePostCaption').value = '';
      if (el('profilePostUrl')) el('profilePostUrl').value = '';
      if (el('profilePostPinned')) el('profilePostPinned').checked = false;
      croppedNewsImageDataUrl = null;
      fullNewsImageDataUrl = null;
      newsLinkUrl = null;
      if (newsVideoFile) {
        var vid = el('newsVideoPreviewEl');
        if (vid && vid.src && vid.src.indexOf('blob:') === 0) URL.revokeObjectURL(vid.src);
        if (vid) vid.src = '';
        newsVideoFile = null;
      }
      if (newsUnifiedField) newsUnifiedField.clearPreview();
      rebuildPollOptionInputs(3);
    }

    function rebuildPollOptionInputs(n){
      var w = el('pollOptionsWrap');
      if (!w) return;
      w.innerHTML = '';
      var count = Math.max(2, Math.min(5, n || 3));
      for (var i = 0; i < count; i++){
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'pollOptInput';
        inp.placeholder = 'Choice ' + (i + 1);
        inp.maxLength = 200;
        inp.style.marginBottom = '6px';
        w.appendChild(inp);
      }
    }
    function getPollChoices(){
      var w = el('pollOptionsWrap');
      if (!w) return [];
      return Array.prototype.slice.call(w.querySelectorAll('.pollOptInput')).map(function(i){ return (i.value || '').trim(); }).filter(Boolean);
    }

    var newsUnifiedPollMode = false;
    var contributeMediaPollMode = null;
    function mountNewsUnifiedForType(){
      var mount = el('newsUnifiedMediaMount');
      if (!mount || !window.LanternUnifiedMediaField) return;
      var t = getContributeType();
      if (t === 'profile_post' || t === 'mission') {
        contributeMediaPollMode = null;
        if (newsUnifiedField){ try { newsUnifiedField.destroy(); } catch(e){} newsUnifiedField = null; }
        mount.innerHTML = '';
        return;
      }
      var isPoll = t === 'poll';
      if (contributeMediaPollMode === isPoll && newsUnifiedField) return;
      contributeMediaPollMode = isPoll;
      if (newsUnifiedField){ try { newsUnifiedField.destroy(); } catch(e){} newsUnifiedField = null; }
      mount.innerHTML = '';
      newsUnifiedPollMode = isPoll;
      newsUnifiedField = window.LanternUnifiedMediaField.mount(mount, {
        allowImage: true,
        allowVideo: !isPoll,
        allowLink: true,
        emptyHelper: isPoll ? 'Add a poll image (or skip and pick a fallback below).' : 'Click here, then paste, drag a file, or choose one.',
        focusedHelper: isPoll ? 'Photo or image link for your poll card.' : 'Ready — paste a picture, short video, or link.',
        onImageFile: handleImageFile,
        onVideoFile: isPoll ? function(){ toast('Polls use a picture or link, not video.'); } : handleVideoFile,
        onLinkUrl: function(u){
          if (isPoll) {
            var v = window.LanternMedia && LanternMedia.isValidLinkUrl ? LanternMedia.isValidLinkUrl(u) : '';
            if (!v) return;
            var imgLike = /\.(png|jpe?g|webp|gif)([\?#]|$)/i.test(v) || /\/api\/(media\/image|news\/image)\?/i.test(v);
            if (!imgLike){ toast('Poll link should be an image URL.'); return; }
          }
          var vv = window.LanternMedia && LanternMedia.isValidLinkUrl ? LanternMedia.isValidLinkUrl(u) : '';
          if (!vv) return;
          newsLinkUrl = vv;
          croppedNewsImageDataUrl = null;
          fullNewsImageDataUrl = null;
          if (newsVideoFile) {
            var vid = el('newsVideoPreviewEl');
            if (vid && vid.src && vid.src.indexOf('blob:') === 0) URL.revokeObjectURL(vid.src);
            if (vid) vid.src = '';
            newsVideoFile = null;
          }
          refreshContributeUnifiedPreview();
          updateStudioAll();
        },
        onClear: function(){
          croppedNewsImageDataUrl = null;
          fullNewsImageDataUrl = null;
          newsLinkUrl = null;
          if (newsVideoFile) {
            var vid = el('newsVideoPreviewEl');
            if (vid && vid.src && vid.src.indexOf('blob:') === 0) URL.revokeObjectURL(vid.src);
            if (vid) vid.src = '';
            newsVideoFile = null;
          }
          updateStudioAll();
        },
      });
      if (!mount._lanternContribUmDelegated) {
        mount._lanternContribUmDelegated = true;
        mount.addEventListener('click', function(ev){
          if (ev.target.id === 'newsContribUmRemove' && newsUnifiedField) newsUnifiedField.clearPreview();
          if (ev.target.id === 'newsContribUmReplace' && newsUnifiedField) { newsUnifiedField.clearPreview(); newsUnifiedField.openFilePicker(); }
        });
      }
      refreshContributeUnifiedPreview();
    }

    function syncMissionCenterFlow(){
      var row = el('contributeMainStudioRow');
      var pick = el('missionPickerState');
      var metaLeft = el('missionRespondMetaLeft');
      if (!row) return;
      row.classList.remove('mission-flow-pick', 'mission-flow-respond');
      if (pick){
        pick.style.display = 'none';
        pick.setAttribute('aria-hidden', 'true');
      }
      if (metaLeft) metaLeft.style.display = 'none';
      var t = getContributeType();
      if (t !== 'mission') return;
      if (!currentMissionForSubmit){
        row.classList.add('mission-flow-pick');
        if (pick){
          pick.style.display = 'block';
          pick.setAttribute('aria-hidden', 'false');
        }
      } else {
        row.classList.add('mission-flow-respond');
        if (metaLeft) metaLeft.style.display = 'block';
      }
    }

    function syncContributeTypeUI(){
      var t = getContributeType();
      if (t !== 'mission' && currentMissionForSubmit){
        closeMissionStudioPanel();

    function mountContributeMissionUnified(allowsImage, allowsVideo, allowsLink){
      var mount = el('missionUnifiedMediaMount');

      destroyContributeMissionUnified();
      var lbl = el('missionUnifiedMediaLabel');

        if (allowsImage && !allowsVideo && !allowsLink) lbl.textContent = 'Add a photo';
        else if (allowsVideo && !allowsImage && !allowsLink) lbl.textContent = 'Add a short video or paste a video link';
        else if (allowsLink && !allowsImage && !allowsVideo) lbl.textContent = 'Add a link';
        else lbl.textContent = 'Add photo, video, or link';
      }
      missionUnifiedField = window.LanternUnifiedMediaField.mount(mount, {
        allowImage: allowsImage,
        allowVideo: allowsVideo,
        allowLink: allowsLink,
        libraryButton: allowsImage ? { label: 'Library', onClick: function(){ openMissionLibraryPicker('mission'); } } : null,
        emptyHelper: 'Click here, then paste, drag a file, or choose one.',
        focusedHelper: 'Ready for photo, video, or link.',
        onPasteUrl: function(u){
          u = String(u || '').trim().slice(0, 2000);
          var imgLike = /\.(png|jpe?g|webp|gif)([\?#]|$)/i.test(u) || /\/api\/(media\/image|news\/image)\?/i.test(u);
          if (allowsImage && imgLike) {
            if (el('missionSubmitImageUrl')) el('missionSubmitImageUrl').value = u;

            if (el('missionSubmitImageUploadPreviewImg')) el('missionSubmitImageUploadPreviewImg').src = '';
            syncContributeMissionUnifiedPreview();
            updateMissionSubmitPreview();
            return true;
          }
          if (allowsLink) {
            if (el('missionSubmitUrl')) el('missionSubmitUrl').value = u;
            if (el('missionSubmitImageUrl')) el('missionSubmitImageUrl').value = '';
            missionVideoUploadedUrl = '';
            if (el('missionSubmitVideoUrl')) el('missionSubmitVideoUrl').value = '';
            if (el('missionSubmitImageUploadPreviewImg')) el('missionSubmitImageUploadPreviewImg').src = '';
            syncContributeMissionUnifiedPreview();
            updateMissionSubmitPreview();
            return true;
          }
          if (allowsVideo) {
            if (el('missionSubmitVideoUrl')) el('missionSubmitVideoUrl').value = u;
            missionVideoUploadedUrl = '';
            if (el('missionSubmitImageUrl')) el('missionSubmitImageUrl').value = '';
            if (el('missionSubmitUrl')) el('missionSubmitUrl').value = '';
            if (el('missionSubmitImageUploadPreviewImg')) el('missionSubmitImageUploadPreviewImg').src = '';
            updateMissionVideoPreview();
            return true;
          }
          return false;

        onImageFile: function(f){
          missionVideoUploadedUrl = '';
          if (el('missionSubmitVideoUrl')) el('missionSubmitVideoUrl').value = '';
          if (el('missionSubmitUrl')) el('missionSubmitUrl').value = '';
          if (el('missionSubmitImageUrl')) el('missionSubmitImageUrl').value = '';
          if (el('missionSubmitImageUploadPreviewImg')) el('missionSubmitImageUploadPreviewImg').src = '';
          if (missionUnifiedField) missionUnifiedField.resetEmptyVisual();
          handleMissionImageFile(f);
        },
        onVideoFile: function(f){
          if (el('missionSubmitImageUrl')) el('missionSubmitImageUrl').value = '';
          if (el('missionSubmitUrl')) el('missionSubmitUrl').value = '';
          if (el('missionSubmitImageUploadPreviewImg')) el('missionSubmitImageUploadPreviewImg').src = '';
          handleMissionVideoFile(f);
        },

          if (el('missionSubmitUrl')) el('missionSubmitUrl').value = String(u || '').trim().slice(0, 2000);

          if (el('missionSubmitImageUploadPreviewImg')) el('missionSubmitImageUploadPreviewImg').src = '';
          syncContributeMissionUnifiedPreview();
          updateMissionSubmitPreview();

    function callGetActiveMissions(characterName){
      if (missionsApiBase != null) {
        return fetch(missionsApiBase + '/api/missions/active', { credentials: 'include' })
          .then(function(r){ return r.json(); })
          .then(function(res){ return (res && res.ok && Array.isArray(res.missions)) ? { ok: true, missions: res.missions } : { ok: false, missions: [] }; })
          .catch(function(){ return { ok: false, missions: [] }; });
      }
      return Promise.resolve({ ok: false, missions: [] });
    }

    function callSubmitMissionCompletion(missionId, characterName, submissionType, submissionContent){
      if (missionsApiBase != null && missionId) {
        return fetch(missionsApiBase + '/api/missions/submit', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mission_id: missionId, submission_type: submissionType || 'text', submission_content: submissionContent || '' })
        }).then(function(r){
          return r.text().then(function(text){
            var data = {};
            try { data = text ? JSON.parse(text) : {}; } catch (e) { return { ok: false, error: 'Invalid response' }; }
            if (!r.ok) return { ok: false, error: (data && data.error) || ('HTTP ' + r.status) };
            if (data && data.ok === false) return { ok: false, error: (data && data.error) || 'Submit failed' };
            return Object.assign({ ok: true }, data);
          });
        }).catch(function(e){ return { ok: false, error: String(e && e.message || e) || 'Network error' }; });
      }
      if (createRun && missionId && characterName) {
        return new Promise(function(resolve){
          createRun().withSuccessHandler(function(r){ resolve(r && r.ok !== false ? r : { ok: false, error: (r && r.error) || 'Failed' }); }).withFailureHandler(function(err){ resolve({ ok: false, error: String(err && err.message || err) }); }).submitMissionCompletion({ mission_id: missionId, character_name: characterName, submission_type: submissionType || 'text', submission_content: String(submissionContent || '') });
        });
      }
      return Promise.resolve({ ok: false, error: 'API not configured' });
    }
    function callResubmitMissionSubmission(subId, submissionContent){
      if (missionsApiBase != null && subId) {
        return fetch(missionsApiBase + '/api/missions/submissions/resubmit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: subId, submission_content: submissionContent || '' })
        }).then(function(r){
          return r.text().then(function(text){
            var data = {};
            try { data = text ? JSON.parse(text) : {}; } catch (e) { return { ok: false, error: 'Invalid response' }; }
            if (!r.ok) return { ok: false, error: (data && data.error) || ('HTTP ' + r.status) };
            if (data && data.ok === false) return { ok: false, error: (data && data.error) || 'Resubmit failed' };
            return Object.assign({ ok: true }, data);
          });
        }).catch(function(e){ return { ok: false, error: String(e && e.message || e) || 'Network error' }; });
      }
      if (createRun && subId) {
        return new Promise(function(resolve){
          createRun().withSuccessHandler(function(r){ resolve(r && r.ok !== false ? r : { ok: false, error: (r && r.error) || 'Failed' }); }).withFailureHandler(function(err){ resolve({ ok: false, error: String(err && err.message || err) }); }).resubmitMissionSubmission({ id: subId, submission_content: String(submissionContent || '') });
        });
      }
      return Promise.resolve({ ok: false, error: 'API not configured' });
    }

        body: JSON.stringify({ image: dataUrl, mime_type: mimeType || 'image/png', file_name: fileName || 'image.png' })
      }).then(function(r){ return parseJsonResponse(r, function(d){ return d && d.image_r2_key != null; }, 'Image upload failed'); }).catch(function(e){ return { ok: false, error: String(e && e.message || e) }; });
    }

    function loadContributeMissions(){
      var adopted = getAdopted();
      var characterName = adopted ? (getCharacterNameForApi() || adopted.name) : '';
      var railEl = el('contributeMissionRail');
      if (!railEl || !window.LanternCards){
        return;
      }
      var LCM = window.LanternCards;
      if (!characterName){
        railEl.innerHTML = '<p class="sectionPlaceholder"><a href="locker.html" style="color:var(--accent);font-weight:800;">Locker</a> · Overview · adopt</p>';
        return;
      }
      railEl.innerHTML = '<p class="sectionPlaceholder">Loading missions…</p>';
      callGetActiveMissions(characterName).then(function(res){
        if (!res || !res.ok){
          railEl.innerHTML = '<p class="sectionPlaceholder" style="color:var(--bad);">Load failed · check connection</p>';
          return;
        }
        var missions = res.missions || [];
        if (!missions.length){
          railEl.innerHTML = '<p class="sectionPlaceholder">No open missions</p>';
          return;
        }
        railEl.innerHTML = '';
        missions.forEach(function(m){
          var node = LCM.buildMissionSpotlightRailElement(m, {
            studioActivate: true,
            onActivate: function(mission){
              openMissionSubmitModal(mission, null, '');
            }
          });
          if (node) railEl.appendChild(node);
        });
        if (pendingStudioMissionOpen && pendingStudioMissionOpen.mission){
          var pm = pendingStudioMissionOpen.mission;
          var rid = pendingStudioMissionOpen.resubmitId || null;
          var pf = pendingStudioMissionOpen.prefill;
          pendingStudioMissionOpen = null;
          var mid = pm && pm.id != null ? String(pm.id) : '';
          var found = missions.filter(function(x){ return String(x.id) === mid; })[0];
          openMissionSubmitModal(found || pm, rid, typeof pf === 'string' ? pf : '');
        }
      });
    }

    function openMissionCropper(dataUrl){
      var modal = el('missionCropperModal');
      var imgEl = el('missionCropperImg');
      if (!modal || !imgEl) return;
      missionCropperSourceDataUrl = dataUrl || null;
      if (missionCropperInstance){ try { missionCropperInstance.destroy(); } catch(e){} missionCropperInstance = null; }
      imgEl.src = dataUrl || '';
      modal.style.display = 'flex';
      imgEl.onload = function(){
        if (typeof window.Cropper === 'undefined'){ toast('Crop tool unavailable'); modal.style.display = 'none'; return; }
        missionCropperInstance = new window.Cropper(imgEl, { aspectRatio: NaN, viewMode: 1, dragMode: 'move', autoCropArea: 0.8 });
      };
    }
    function finishMissionCropper(){
      var modal = el('missionCropperModal');
      var uploadPreviewImg = el('missionSubmitImageUploadPreviewImg');
      var imageUrlEl = el('missionSubmitImageUrl');
      if (!modal || !imageUrlEl || missionsApiBase === null) return;
      var dataUrlToUpload = null;
      if (missionCropperInstance){
        try {
          var canvas = missionCropperInstance.getCroppedCanvas({ maxWidth: 800, maxHeight: 600, imageSmoothingEnabled: true, imageSmoothingQuality: 'high' });
          if (canvas && canvas.width > 0 && canvas.height > 0) {
            dataUrlToUpload = canvas.toDataURL('image/png');
          } else if (missionCropperSourceDataUrl) {
            dataUrlToUpload = missionCropperSourceDataUrl;
          }
        } catch(e){
          if (missionCropperSourceDataUrl) dataUrlToUpload = missionCropperSourceDataUrl;
        }
        try { missionCropperInstance.destroy(); } catch(e){}
        missionCropperInstance = null;
      }
      modal.style.display = 'none';
      missionCropperSourceDataUrl = null;
      if (!dataUrlToUpload){ toast('Could not crop image'); return; }
      callUploadMissionImage(dataUrlToUpload, 'image/png', 'image.png').then(function(res){
        if (res && res.ok && res.image_r2_key) {
          imageUrlEl.value = missionsApiBase + '/api/news/image?key=' + encodeURIComponent(res.image_r2_key);
          if (uploadPreviewImg) uploadPreviewImg.src = dataUrlToUpload;
          syncContributeMissionUnifiedPreview();
        } else { toast(res && res.error ? res.error : 'Image upload failed'); }
        updateMissionSubmitPreview();
      });
    }
    function handleMissionImageFile(file){
      if (!file || !file.type || file.type.indexOf('image') !== 0) return;
      var reader = new FileReader();
      reader.onload = function(){ openMissionCropper(reader.result); };
      reader.readAsDataURL(file);
    }
    function clearMissionImageUpload(){
      var imageUrlEl = el('missionSubmitImageUrl');
      var uploadPreviewImg = el('missionSubmitImageUploadPreviewImg');
      if (imageUrlEl) imageUrlEl.value = '';
      if (uploadPreviewImg) uploadPreviewImg.src = '';
      syncContributeMissionUnifiedPreview();
      updateMissionSubmitPreview();
    }
    function updateMissionVideoPreview(){
      var input = el('missionSubmitVideoUrl');
      var wrap = el('missionSubmitVideoPreview');
      var video = el('missionSubmitVideoPreviewEl');
      var url = (missionVideoUploadedUrl || (input && input.value || '').trim()) || '';
      if (!wrap) return;
      if (!url){ wrap.style.display = 'none'; syncContributeMissionUnifiedPreview(); updateMissionSubmitPreview(); return; }
      wrap.style.display = 'block';
      if (video){ video.style.display = ''; video.onerror = function(){}; video.onloadeddata = function(){}; video.src = url; }
      syncContributeMissionUnifiedPreview();
      updateMissionSubmitPreview();
    }
    function handleMissionVideoFile(file){
      if (!file || !file.type.match(/^video\/(mp4|webm)$/)){ toast('Please choose an MP4 or WebM video.'); return; }
      if (file.size > 25 * 1024 * 1024){ toast('Video too large. Max 25MB.'); return; }
      if (missionsApiBase === null){ toast('API not configured'); return; }
      var reader = new FileReader();
      reader.onload = function(){
        callUploadMissionVideo(reader.result, file.type || 'video/mp4', file.name || 'video.mp4').then(function(res){
          if (res && res.video_r2_key){
            missionVideoUploadedUrl = missionsApiBase + '/api/news/video?key=' + encodeURIComponent(res.video_r2_key);
            if (el('missionSubmitVideoUrl')) el('missionSubmitVideoUrl').value = '';
            updateMissionVideoPreview();
          }
          else { toast(res && res.error ? res.error : 'Video upload failed'); }
        });
      };
      reader.readAsDataURL(file);
    }
    function clearMissionVideo(){ missionVideoUploadedUrl = ''; var urlEl = el('missionSubmitVideoUrl'); if (urlEl) urlEl.value = ''; updateMissionVideoPreview(); updateMissionSubmitPreview(); }
    function updateMissionLinkPreview(){

    function openMissionSubmitModal(m, resubmitId, prefill){
      currentMissionForSubmit = m;
      currentMissionResubmitId = resubmitId || null;
      destroyContributeMissionUnified();
      var metaEl = el('missionSelectedMeta');
      if (metaEl && m) {
        metaEl.style.display = 'block';
        var escM = function(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;'; }); };
        var st = String(m.submission_type || 'response').trim();
        var rew = m.reward_amount != null && m.reward_amount !== '' ? m.reward_amount : 0;
        metaEl.innerHTML = '<div style="font-weight:900;font-size:22px;">' + escM(m.title || 'Mission') + '</div><div class="missionReward" style="margin-top:4px;">+' + escM(String(rew)) + ' nuggets</div><div class="studioPanelMicro" style="margin-top:6px;">Type: ' + escM(st) + '</div>';
      }
      var panel = el('missionStudioFormPanel');
      var titleEl = el('missionSubmitTitle');
      var labelEl = el('missionSubmitLabel');
      var contentEl = el('missionSubmitContent');
      var textWrap = el('missionSubmitTextWrap');
      var urlEl = el('missionSubmitUrl');
      var imageUrlEl = el('missionSubmitImageUrl');
      var videoUrlEl = el('missionSubmitVideoUrl');
      var pollWrap = el('missionSubmitPollWrap');
      var bugWrap = el('missionSubmitBugReportWrap');
      var stMission = String(m.submission_type || '').trim();
      var isPollMission = stMission === 'poll';
      var isBugMission = stMission === 'bug_report';
      var allowsText = m.allows_text !== false && m.allows_text !== 0;
      var allowsImage = !!(m.allows_image);
      var allowsVideo = !!(m.allows_video);
      var allowsLink = !!(m.allows_link);
      var anyMed = !isPollMission && !isBugMission && (allowsImage || allowsVideo || allowsLink);
      if (titleEl) titleEl.textContent = (currentMissionResubmitId ? 'Resubmit: ' : 'Complete: ') + (m.title || '');
      if (labelEl) labelEl.textContent = m.submission_type === 'confirmation' ? 'Optional note' : 'Your response';
      if (textWrap) textWrap.style.display = (!isPollMission && !isBugMission && allowsText) ? 'block' : 'none';
      if (pollWrap) pollWrap.style.display = isPollMission ? 'block' : 'none';
      if (bugWrap) bugWrap.style.display = isBugMission ? 'block' : 'none';
      var outer = el('missionUnifiedMediaOuter');
      if (outer) outer.style.display = anyMed ? 'block' : 'none';
      var pf = (typeof prefill === 'string') ? prefill : '';
      if (isPollMission) {
        if (contentEl) contentEl.value = '';
        if (imageUrlEl) imageUrlEl.value = '';
        missionVideoUploadedUrl = '';
        if (videoUrlEl) videoUrlEl.value = '';
        if (urlEl) urlEl.value = '';
        if (el('missionSubmitPollQuestion')) el('missionSubmitPollQuestion').value = '';
        ['missionSubmitPollChoice1','missionSubmitPollChoice2','missionSubmitPollChoice3','missionSubmitPollChoice4'].forEach(function(id){ if (el(id)) el(id).value = ''; });
        if (el('missionSubmitPollImageUrl')) el('missionSubmitPollImageUrl').value = '';
        try {
          var parsed = pf ? JSON.parse(pf) : null;
          if (parsed && typeof parsed === 'object') {
            if (el('missionSubmitPollQuestion')) el('missionSubmitPollQuestion').value = String(parsed.question || '').slice(0, 500);
            var ch = Array.isArray(parsed.choices) ? parsed.choices : [];
            var ids = ['missionSubmitPollChoice1','missionSubmitPollChoice2','missionSubmitPollChoice3','missionSubmitPollChoice4'];
            for (var ci = 0; ci < ch.length && ci < ids.length; ci++) { if (el(ids[ci])) el(ids[ci]).value = String(ch[ci] || '').slice(0, 200); }
            var imgU = (parsed.image_url || parsed.image || '').trim();
            if (imgU && el('missionSubmitPollImageUrl')) el('missionSubmitPollImageUrl').value = imgU.slice(0, 500);
          }
        } catch (e1) {}
        updateMissionPollImagePreview();
        currentMissionMinChars = 0;
        if (el('missionSubmitMinCharsHint')) el('missionSubmitMinCharsHint').style.display = 'none';
        if (el('missionSubmitImageUploadPreviewImg')) el('missionSubmitImageUploadPreviewImg').src = '';
        if (panel) { panel.classList.add('missionStudioFormPanel--open'); panel.setAttribute('aria-hidden', 'false'); }
        updateMissionSubmitPreview();
        syncMissionCenterFlow();
        return;
      }
      if (isBugMission) {
        if (contentEl) contentEl.value = '';
        if (imageUrlEl) imageUrlEl.value = '';
        missionVideoUploadedUrl = '';
        if (videoUrlEl) videoUrlEl.value = '';
        if (urlEl) urlEl.value = '';
        if (el('missionSubmitBugReportDesc')) el('missionSubmitBugReportDesc').value = '';
        if (el('missionSubmitBugReportScreenshot')) el('missionSubmitBugReportScreenshot').value = '';
        try {
          var bj = pf ? JSON.parse(pf) : null;
          if (bj && typeof bj === 'object') {
            if (el('missionSubmitBugReportDesc')) el('missionSubmitBugReportDesc').value = String(bj.description || bj.text || '').slice(0, 2000);
            var shot = (bj.image_url || bj.image || '').trim();
            if (shot && el('missionSubmitBugReportScreenshot')) el('missionSubmitBugReportScreenshot').value = shot.slice(0, 500);
          } else if (pf) {
            if (el('missionSubmitBugReportDesc')) el('missionSubmitBugReportDesc').value = pf.slice(0, 2000);
          }
        } catch (e2) {
          if (pf && el('missionSubmitBugReportDesc')) el('missionSubmitBugReportDesc').value = pf.slice(0, 2000);
        }
        currentMissionMinChars = 0;
        if (el('missionSubmitMinCharsHint')) el('missionSubmitMinCharsHint').style.display = 'none';
        if (el('missionSubmitImageUploadPreviewImg')) el('missionSubmitImageUploadPreviewImg').src = '';
        if (panel) { panel.classList.add('missionStudioFormPanel--open'); panel.setAttribute('aria-hidden', 'false'); }
        updateMissionSubmitPreview();
        syncMissionCenterFlow();
        return;
      }
      if (contentEl) contentEl.value = (m.submission_type === 'text' || m.submission_type === 'confirmation' || allowsText) ? pf : '';
      if (imageUrlEl) imageUrlEl.value = m.submission_type === 'image_url' ? pf : '';
      missionVideoUploadedUrl = '';
      if (videoUrlEl) videoUrlEl.value = '';
      if (m.submission_type === 'video' && pf && pf.trim().indexOf('http') === 0) {
        missionVideoUploadedUrl = pf.trim().slice(0, 2000);
      } else if (allowsVideo && m.submission_type === 'link' && pf && pf.trim().indexOf('http') === 0 && !allowsImage && !allowsLink) {
        if (videoUrlEl) videoUrlEl.value = pf.trim().slice(0, 2000);
      }
      if (urlEl) urlEl.value = (m.submission_type === 'link' && pf && pf.trim().indexOf('http') === 0) ? pf.trim().slice(0, 2000) : '';
      if (el('missionSubmitImageUploadPreviewImg')) el('missionSubmitImageUploadPreviewImg').src = '';
      var minChars = m.min_characters !== undefined && m.min_characters !== null ? Math.max(0, parseInt(m.min_characters, 10) || 200) : 0;
      var enforceMin = allowsText && minChars > 0;
      currentMissionMinChars = enforceMin ? minChars : 0;
      var minCharsHint = el('missionSubmitMinCharsHint');
      if (minCharsHint) {
        if (allowsText && minChars > 0) {
          minCharsHint.textContent = 'Minimum characters required: ' + minChars;
          minCharsHint.style.display = 'block';
        } else {
          minCharsHint.style.display = 'none';
        }
      }
      if (anyMed) mountContributeMissionUnified(allowsImage, allowsVideo, allowsLink);
      updateMissionVideoPreview();
      updateMissionLinkPreview();
      if (panel) {
        panel.classList.add('missionStudioFormPanel--open');
        panel.setAttribute('aria-hidden', 'false');
      }
      updateMissionSubmitPreview();
      syncMissionCenterFlow();
    }

    function updateMissionSubmitPreview(){
      if (getContributeType() === 'mission') {
        updateStudioAll();
        return;
      }
    }

    var missionCloseBtn = el('missionSubmitCloseBtn');
    if (missionCloseBtn) missionCloseBtn.addEventListener('click', closeMissionStudioPanel);
    el('missionCropperUseBtn').addEventListener('click', finishMissionCropper);
    el('missionCropperCancelBtn').addEventListener('click', function(){ if (missionCropperInstance){ try { missionCropperInstance.destroy(); } catch(e){} missionCropperInstance = null; } el('missionCropperModal').style.display = 'none'; });
    var missionUmMount = el('missionUnifiedMediaMount');
    if (missionUmMount) {
      missionUmMount.addEventListener('click', function(e){
        if (e.target.id === 'missionUmRemove' && missionUnifiedField) {
          missionUnifiedField.clearPreview();
          updateMissionSubmitPreview();
        }
        if (e.target.id === 'missionUmReplace' && missionUnifiedField) {
          missionUnifiedField.clearPreview();
          missionUnifiedField.openFilePicker();
          updateMissionSubmitPreview();
        }
      });
    }
    if (el('missionSubmitContent')) { el('missionSubmitContent').addEventListener('input', updateMissionSubmitPreview); el('missionSubmitContent').addEventListener('change', updateMissionSubmitPreview); }
    ['missionSubmitPollQuestion','missionSubmitPollChoice1','missionSubmitPollChoice2','missionSubmitPollChoice3','missionSubmitPollChoice4','missionSubmitPollImageUrl','missionSubmitBugReportDesc','missionSubmitBugReportScreenshot'].forEach(function(mid){
      var mn = el(mid);
      if (mn){ mn.addEventListener('input', updateMissionSubmitPreview); mn.addEventListener('change', updateMissionSubmitPreview); }
    });
    if (el('missionSubmitPollLibraryBtn')) el('missionSubmitPollLibraryBtn').addEventListener('click', function(){ openMissionLibraryPicker('poll'); });
    if (el('missionSubmitLibraryCloseBtn')) el('missionSubmitLibraryCloseBtn').addEventListener('click', function(){
      var lm = el('missionSubmitLibraryModal');
      if (lm){ lm.style.display = 'none'; lm.classList.remove('show'); }
    });
    var libModal = el('missionSubmitLibraryModal');
    if (libModal) libModal.addEventListener('click', function(e){ if (e.target === libModal){ libModal.style.display = 'none'; libModal.classList.remove('show'); } });

    el('missionSubmitBtn').addEventListener('click', async function(){
      var adopted = getAdopted();
      if (!adopted || !adopted.name){ toast('Adopt a character first'); return; }
      if (!currentMissionForSubmit){ toast('No mission selected'); return; }
      var m = currentMissionForSubmit;
      var mst = String(m.submission_type || '').trim();
      var btnM = el('missionSubmitBtn');
      if (mst === 'poll'){
        var pq = (el('missionSubmitPollQuestion') && el('missionSubmitPollQuestion').value || '').trim();
        var pch = [1,2,3,4].map(function(i){ return (el('missionSubmitPollChoice' + i) && el('missionSubmitPollChoice' + i).value || '').trim(); }).filter(Boolean);
        var pimg = (el('missionSubmitPollImageUrl') && el('missionSubmitPollImageUrl').value || '').trim();
        if (!pq){ toast('Enter your poll question.'); return; }
        if (pch.length < 2 || pch.length > 4){ toast('Enter 2 to 4 answer choices.'); return; }
        if (!pimg){ toast('Add a poll image URL or pick from the library.'); return; }
        var pollPayload = JSON.stringify({ question: pq.slice(0, 500), choices: pch.map(function(c){ return c.slice(0, 200); }), image_url: pimg.slice(0, 500) });
        btnM.disabled = true;
        var resP;
        if (currentMissionResubmitId) resP = await callResubmitMissionSubmission(currentMissionResubmitId, pollPayload);
        else resP = await callSubmitMissionCompletion(m.id, getCharacterNameForApi() || adopted.name, 'poll', pollPayload);
        btnM.disabled = false;
        if (!resP.ok){ toast(resP.error || 'Failed'); return; }
        toast(FERPA_STUDENT_SUBMIT_MESSAGE, 5200);
        closeMissionStudioPanel();
        loadContributeMissions();
        return;
      }
      if (mst === 'bug_report'){
        var bdesc = (el('missionSubmitBugReportDesc') && el('missionSubmitBugReportDesc').value || '').trim();
        var bimg = (el('missionSubmitBugReportScreenshot') && el('missionSubmitBugReportScreenshot').value || '').trim();
        if (!bdesc){ toast('Description is required.'); return; }
        var bugPayload = JSON.stringify({ description: bdesc.slice(0, 2000), image_url: bimg ? bimg.slice(0, 500) : '' });
        btnM.disabled = true;
        var resB;
        if (currentMissionResubmitId) resB = await callResubmitMissionSubmission(currentMissionResubmitId, bugPayload);
        else resB = await callSubmitMissionCompletion(m.id, getCharacterNameForApi() || adopted.name, 'bug_report', bugPayload);
        btnM.disabled = false;
        if (!resB.ok){ toast(resB.error || 'Failed'); return; }
        toast(FERPA_STUDENT_SUBMIT_MESSAGE, 5200);
        closeMissionStudioPanel();
        loadContributeMissions();
        return;
      }
      var allowsText = m.allows_text !== false && m.allows_text !== 0;
      var allowsImage = !!(m.allows_image);
      var allowsVideo = !!(m.allows_video);
      var allowsLink = !!(m.allows_link);
      var textVal = (el('missionSubmitContent') && el('missionSubmitContent').value || '').trim();
      var imageVal = (el('missionSubmitImageUrl') && el('missionSubmitImageUrl').value || '').trim();
      var videoVal = (el('missionSubmitVideoUrl') && el('missionSubmitVideoUrl').value || '').trim();
      var linkVal = (el('missionSubmitUrl') && el('missionSubmitUrl').value || '').trim();
      var minChars = currentMissionMinChars;
      var validText = allowsText && (minChars <= 0 ? textVal.length > 0 : textVal.length >= minChars);
      var validImage = allowsImage && (imageVal.length > 0 || (el('missionSubmitImageUploadPreviewImg') && el('missionSubmitImageUploadPreviewImg').src && String(el('missionSubmitImageUploadPreviewImg').src).trim().length > 0));
      var validVideo = allowsVideo && (missionVideoUploadedUrl || videoVal.length > 0);
      var validLink = allowsLink && linkVal.length > 0;
      var hasAnyValid = validText || validImage || validVideo || validLink;
      if (!hasAnyValid) {
        if (allowsText && minChars > 0 && textVal.length > 0 && textVal.length < minChars) toast('Minimum ' + minChars + ' characters required.');
        else if (allowsText && !allowsImage && !allowsVideo && !allowsLink) toast('This mission requires a written response.');
        else toast('Please add a valid submission before sending.');
        return;
      }
      var mid = (m.id || '').trim();
      if (mid === 'perm_show_something_cool' || mid === 'perm_report_good_news') {
        if (!validImage) { toast('This mission requires an image.'); return; }
      }
      if (mid === 'perm_create_something') {
        if (!validImage && !validVideo) { toast('This mission requires an image or video.'); return; }
      }
      var type = 'text';
      var content = '';
      if (allowsText && textVal){ type = 'text'; content = textVal; }
      else if (allowsImage && imageVal){ type = 'image_url'; content = imageVal; }
      else if (allowsVideo && missionVideoUploadedUrl){ type = 'video'; content = missionVideoUploadedUrl; }
      else if (allowsVideo && videoVal){ type = 'link'; content = videoVal; }
      else if (allowsLink && linkVal){ type = 'link'; content = linkVal; }
      else if (allowsText){ type = 'text'; content = textVal; }
      else if (allowsImage){ type = 'image_url'; content = imageVal; }
      else if (allowsVideo){ type = missionVideoUploadedUrl ? 'video' : 'link'; content = missionVideoUploadedUrl || videoVal; }
      else if (allowsLink){ type = 'link'; content = linkVal; }
      if (m.submission_type === 'confirmation') type = 'confirmation';
      btnM.disabled = true;
      var res;
      if (currentMissionResubmitId) {
        res = await callResubmitMissionSubmission(currentMissionResubmitId, content);
      } else {
        res = await callSubmitMissionCompletion(m.id, getCharacterNameForApi() || adopted.name, type, content);
      }
      btnM.disabled = false;
      if (!res.ok){ toast(res.error || 'Failed'); return; }
      toast(FERPA_STUDENT_SUBMIT_MESSAGE, 5200);
      closeMissionStudioPanel();
      loadContributeMissions();
    });
  </script>
  <script src="js/lantern-canonical-enforce.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui">
  <title>Stack Lab</title>
  <!--
    Engine bundle and Zepto stay on explicit donor paths (cleared code).
    Canvas media resolves to ./assets/ (runtime overlay). Drop Lantern files
    into lantern-assets/ and run apply-asset-overlay.mjs to swap slots.
  -->
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=2">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{background:#1b2438;height:100%;overflow:hidden}
    body{
      font-family:Arial,Helvetica,sans-serif;
      margin:0 auto;
      text-align:center;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#1b2438;
      color:#eaf0ff;
    }
    #canvas{position:fixed;left:0;top:0;right:0;bottom:0;margin:auto}
    a{text-decoration:none}
    li,ol,ul{list-style-type:none;padding:0;margin:0}
    .hide{display:none}
    .loading{background-color:#1b2438;height:100%;width:100%}
    .loading .main{width:80%;max-width:320px;margin:0 auto;color:#eaf0ff;padding-top:18vh}
    .loading .lantern-lab-mark{
      font-size:32px;
      font-weight:900;
      letter-spacing:.04em;
      margin:0 0 12px;
    }
    .loading .title{font-size:28px;font-weight:800}
    .loading .text{font-size:22px;margin-top:8px}
    .loading .bar{height:18px;width:100%;border:2px solid #eaf0ff;border-radius:18px;margin:12px 0}
    .loading .bar .sub{height:14px;width:98%;margin:2px auto 0}
    .loading .bar .percent{height:100%;width:0;background-color:#5aa7ff;border-radius:18px}
    .content{height:100vh;margin:0 auto;position:relative}
    .landing{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:24px;
      min-height:100%;
      padding:24px 16px;
    }
    .lantern-title{
      font-size:36px;
      font-weight:900;
      line-height:1.15;
      margin:0;
      color:#fff;
    }
    .lantern-sub{
      font-size:22px;
      line-height:1.35;
      margin:8px 0 0;
      color:#b9c6ea;
      font-weight:700;
    }
    .lantern-start{
      appearance:none;
      border:0;
      border-radius:18px;
      background:#5aa7ff;
      color:#081018;
      font-size:28px;
      font-weight:900;
      padding:14px 28px;
      min-width:70%;
      cursor:pointer;
      font-family:Arial,Helvetica,sans-serif;
    }
    .slideTop{-webkit-animation:st 1s ease-in-out;animation:st 1s ease-in-out}
    @-webkit-keyframes st{0%{transform:translateZ(0)}100%{transform:translate3d(0,-100%,0)}}
    @keyframes st{0%{transform:translateZ(0)}100%{transform:translate3d(0,-100%,0)}}
    .slideBottom{-webkit-animation:sb 1s ease-in-out;animation:sb 1s ease-in-out}
    @-webkit-keyframes sb{0%{transform:translateZ(0)}100%{transform:translate3d(0,200%,0)}}
    @keyframes sb{0%{transform:translateZ(0)}100%{transform:translate3d(0,200%,0)}}
    .modal .mask{background-color:#000;opacity:.6;position:fixed;height:100%;width:100%;top:0;left:0}
    .modal .modal-content{position:fixed;height:100%;width:90%;margin-top:.3rem;top:0;left:0;right:0}
    .modal .main{width:85%;margin:0 auto}
    .modal .container{position:relative}
    .modal .modal-main{width:100%;position:relative;margin-top:18vh}
    .lantern-over-card{
      background:#162033;
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:20px 16px;
    }
    .lantern-over-title{font-size:32px;font-weight:900;margin:0 0 8px;color:#fff}
    .over-score{margin:8px 0;font-size:36px;color:#ffcc66;font-weight:900}
    .tip{font-size:22px;color:#b9c6ea;font-weight:700}
    .lantern-hud-font{font-family:Arial,Helvetica,sans-serif}
  </style>
</head>
<body>
  <canvas id="canvas" class="hide"></canvas>
  <div class="content">
    <div class="loading">
      <div class="main">
        <div class="lantern-lab-mark">STACK LAB</div>
        <div class="progress">
          <div class="title lantern-hud-font">0%</div>
          <div class="bar"><div class="sub"><div class="percent"></div></div></div>
          <div class="text">Loading…</div>
        </div>
      </div>
    </div>
    <div class="landing hide">
      <div class="action-1">
        <h1 class="lantern-title">Stack Lab</h1>
        <p class="lantern-sub">Lab preview · name TBD</p>
      </div>
      <div class="action-2">
        <button type="button" id="start" class="lantern-start">Start</button>
      </div>
    </div>
    <div id="modal" class="modal hide">
      <div class="mask"></div>
      <div class="js-modal-content modal-content">
        <div class="main">
          <div class="container">
            <div class="modal-main">
              <div id="over-modal" class="hide js-modal-card lantern-over-card">
                <div class="lantern-over-title">Game over</div>
                <div id="score" class="over-score lantern-hud-font"></div>
                <div id="over-zero" class="hide">
                  <div class="tip">
                    <p>Try again</p>
                    <button type="button" class="lantern-start js-reload">Try again</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="./donor/dist/main.js"></script>
  <script src="./donor/assets/zepto-1.1.6.min.js"></script>
  <script src="/games/tower/lantern-adapter.js"></script>
  <script>
    var domReady, loadFinish, canvasReady, loadError, gameStart, game, score, successCount;
    var gameWidth = window.innerWidth;
    var gameHeight = window.innerHeight;
    var ratio = 1.5;
    if (gameHeight / gameWidth < ratio) {
      gameWidth = Math.ceil(gameHeight / ratio);
    }
    $('.content').css({ height: gameHeight + 'px', width: gameWidth + 'px' });
    $('.js-modal-content').css({ width: gameWidth + 'px' });

    function hideLoading() {
      if (domReady && canvasReady) {
        $('#canvas').show();
        loadFinish = true;
        setTimeout(function () {
          $('.loading').hide();
          $('.landing').show();
        }, 1000);
      }
    }

    function updateLoading(status) {
      var success = status.success;
      var total = status.total;
      var failed = status.failed;
      if (failed > 0 && !loadError) {
        loadError = true;
        alert('Network error... Please try again.');
        return;
      }
      var percent = parseInt((success / total) * 100, 10);
      if (percent === 100 && !canvasReady) {
        canvasReady = true;
        hideLoading();
      }
      percent = percent > 98 ? 98 : percent;
      percent = percent + '%';
      $('.loading .title').text(percent);
      $('.loading .percent').css({ width: percent });
    }

    function overShowOver() {
      $('#modal').show();
      $('#over-modal').show();
      $('#over-zero').show();
    }

    var option = {
      width: gameWidth,
      height: gameHeight,
      canvasId: 'canvas',
      soundOn: false,
      setGameScore: function (s) {
        score = s;
      },
      setGameSuccess: function (s) {
        successCount = s;
      },
      setGameFailed: function (f) {
        $('#score').text(score);
        if (f >= 3) overShowOver();
      }
    };
    if (window.LanternDonorAdapter && typeof window.LanternDonorAdapter.wrapOptions === 'function') {
      option = window.LanternDonorAdapter.wrapOptions(option);
    }

    function gameReady() {
      game = TowerGame(option);
      if (window.LanternDonorAdapter && typeof window.LanternDonorAdapter.silenceAudio === 'function') {
        window.LanternDonorAdapter.silenceAudio(game);
      }
      game.load(function () {
        game.init();
      }, updateLoading);
    }

    gameReady();

    function indexHide() {
      $('.landing .action-1').addClass('slideTop');
      $('.landing .action-2').addClass('slideBottom');
      setTimeout(function () {
        $('.landing').hide();
      }, 950);
    }

    $('#start').on('click', function () {
      if (gameStart) return;
      gameStart = true;
      if (window.LanternDonorAdapter) window.LanternDonorAdapter.notifyGameStarted();
      indexHide();
      setTimeout(game.start, 400);
    });

    $('.js-reload').on('click', function () {
      window.location.reload();
    });

    window.addEventListener('load', function () {
      domReady = true;
      hideLoading();
    }, false);
  </script>
</body>
</html>

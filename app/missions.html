  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f1b33;
      --ink:#eaf0ff;
      --muted:#b9c6ea;
      --accent:#5aa7ff;
      --good:#38d07c;
      --warn:#ffcc66;
      --line: rgba(255,255,255,.12);
      --r: 18px;
      --fsBase: 22px;
    }
    *{box-sizing:border-box}
    html{ min-height: 100%; }
    body{
      margin:0;
      background: linear-gradient(180deg, #070b12, #05070b);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: var(--fsBase);
      overflow-x: hidden;
    }
    a{ color: var(--accent); text-decoration: none; font-weight: 800; }
    a:hover{ text-decoration: underline; }
    /* Outer shell: lantern-header.css .wrap.lanternContent */
    .wrap.lanternContent{ position: relative; z-index: 1; }
    .section{ margin-bottom: 28px; }
    /* Match explore.html rail row titles */
    .missionsPageWrap .sectionHd{
      font-weight: 900;
      font-size: 26px;
      margin-bottom: 4px;
      letter-spacing: .2px;
      padding: 14px var(--lantern-pad-x) 0;
      color: var(--ink);
    }
    .sectionBd{ }
    /* Missions (reused from Profile) */
    .missionFeaturedPill{
      display: inline-block;
      margin-right: 6px;
      margin-bottom: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255,204,102,.55);
      background: rgba(255,204,102,.2);
      color: var(--ink);
      vertical-align: middle;
    }
    .missionFeaturedPill--today{
      border-color: rgba(90,167,255,.55);
      background: rgba(90,167,255,.22);
    }
    .myMissionsSub{ margin-top: 20px; }
    .myMissionsSubHd{ font-weight: 900; font-size: 22px; margin-bottom: 10px; color: var(--muted); }
    .missionRow{
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .missionRow:last-child{ border-bottom: none; }
    .missionInfo{ flex: 1; min-width: 0; }
    .missionName{ font-weight: 900; font-size: 22px; }
    .missionReward{ font-size: 20px; color: var(--warn); font-weight: 800; margin-top: 2px; }
    .missionStatus{ font-size: 22px; color: var(--muted); }
    .missionStatus.completed{ color: var(--good); }
    .sectionPlaceholder{ color: var(--muted); font-size: 22px; padding: 12px 0; }
    .btn{ padding: 10px 18px; border-radius: 12px; font-weight: 800; font-size: 22px; cursor: pointer; border: none; font-family: inherit; }
    .btn.good{ background: linear-gradient(180deg, rgba(56,208,124,.35), rgba(56,208,124,.15)); color: var(--ink); border: 1px solid rgba(56,208,124,.5); }
    .btn.small{ padding: 6px 14px; font-size: 20px; }
    .overlay{ position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .overlay.show{ display: flex; }
    .modal{ background: var(--panel); border-radius: var(--r); padding: 20px; max-width: 480px; width: 100%; border: 1px solid var(--line); }
    .modalHd{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modalHd .h{ font-weight: 1000; font-size: 26px; }
    .modalHd .x{ background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 4px; }
    textarea, input[type=url]{ width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--ink); font-size: 22px; font-family: inherit; }
    label{ display: block; font-weight: 800; margin-bottom: 8px; font-size: 22px; }
    .quickMissionLink{ display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    .toastWrap{ position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10002; display: none; padding: 12px 20px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-weight: 800; font-size: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    .toastWrap.show{ display: block; }
    .missionSubmitProgressWrap{ margin-top: 10px; }
    .missionSubmitProgressBar{ height: 8px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden; width: 100%; }
    .missionSubmitProgressFill{ height: 100%; border-radius: 999px; transition: width .25s ease; }
    .missionSubmitProgressFill.neutral{ background: rgba(255,255,255,.25); }
    .missionSubmitProgressFill.amber{ background: linear-gradient(90deg, rgba(255,204,102,.85), rgba(255,170,68,.8)); }
    .missionSubmitProgressFill.met{ background: linear-gradient(90deg, rgba(56,208,124,.85), rgba(56,180,100,.8)); }
    .missionSubmitCountdown{ font-size: 20px; font-weight: 800; margin-top: 6px; margin-bottom: 0; }
    .missionSubmitCountdown.neutral{ color: var(--muted); }
    .missionSubmitCountdown.amber{ color: var(--warn); }
    .missionSubmitCountdown.met{ color: var(--good); }
    .missionVerifyBypassHint{ font-size: 18px; font-weight: 800; color: var(--muted); margin-top: 8px; margin-bottom: 0; }
    .missionBurstWarning{ font-size: 18px; font-weight: 800; color: var(--warn); margin-top: 8px; margin-bottom: 0; }
    .missionMediaPreviewWrap{ margin-top: 10px; }
    .missionImagePreview img{ max-height: 320px; max-width: 100%; border-radius: 12px; display: block; }
    .missionImagePreviewFallback{ font-size: 18px; font-weight: 800; color: var(--muted); padding: 12px 0; }
    .missionSubmitImageDrop{ border: 2px dashed var(--line); border-radius: var(--r); background: rgba(0,0,0,.2); padding: 16px; margin-top: 8px; margin-bottom: 8px; }
    .missionSubmitImagePlaceholder{ cursor: pointer; font-size: 22px; font-weight: 800; color: var(--muted); text-align: center; padding: 12px 0; }
    .missionSubmitImageDrop.dragover{ border-color: var(--accent); background: rgba(90,167,255,.08); }
    .missionSubmitImagePreviewWrap{ margin-top: 8px; }
    .missionSubmitImagePreviewWrap img{ max-height: 200px; max-width: 100%; border-radius: 12px; display: block; }
    .missionSubmitImageActions{ margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .missionVideoPreview video{ max-height: 360px; max-width: 100%; border-radius: 12px; display: block; }
    .missionVideoPreviewFallback{ font-size: 18px; font-weight: 800; color: var(--muted); padding: 12px 0; }
    .missionSubmitPreviewWrap{ margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .missionSubmitPreviewLabel{ font-weight: 900; font-size: 22px; color: var(--muted); margin-bottom: 10px; }
    .missionSubmitPreviewCard{ min-height: 80px; }
    .missionLinkPreviewCard{ margin-top: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.2); font-size: 20px; }
    .missionLinkPreviewCard a{ font-weight: 800; word-break: break-all; }
    .missionLinkPreviewCard .missionLinkDomain{ font-size: 18px; color: var(--muted); margin-top: 4px; }
    .missionCropperModal{ position: fixed; inset: 0; z-index: 10001; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .missionCropperModal .missionCropperBox{ background: var(--panel); border-radius: var(--r); padding: 20px; max-width: 100%; width: 100%; max-width: 520px; border: 1px solid var(--line); }
    .missionCropperModal .missionCropperTitle{ font-weight: 900; font-size: 26px; margin-bottom: 14px; }
    .missionCropperModal .missionCropperImgWrap{ max-height: 60vh; margin: 0 auto 14px; background: #000; border-radius: 10px; overflow: hidden; }
    .missionCropperModal .missionCropperImgWrap img{ max-width: 100%; display: block; }
    .missionCropperModal .missionCropperActions{ display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  </style>

  <script>
  (function(){
    var auth = window.LanternAuth || window.LanternPilotAuth;
    if (!auth || typeof auth.guardPilotPage !== 'function') {
      location.replace('/login.html?return=' + encodeURIComponent(location.pathname + location.search + location.hash));
      return;
    }
    auth.guardPilotPage({ mode: 'general' }, function (data) {
      window.LANTERN_PILOT_ME = data;
      if (auth.applyStudentStorageFromSession) auth.applyStudentStorageFromSession(data);
      document.documentElement.classList.remove('lantern-pilot-auth-pending');
      if (typeof window.__bootMissionsPage === 'function') window.__bootMissionsPage();
    });
  })();
  </script>

  <script>
    (function(){ try { if (window.LANTERN_DATA) { if (window.LANTERN_DATA.ensureCharacters) window.LANTERN_DATA.ensureCharacters(); if (window.LANTERN_DATA.ensureCatalog) window.LANTERN_DATA.ensureCatalog(); if (window.LANTERN_DATA.ensureStartupMode) window.LANTERN_DATA.ensureStartupMode(); } } catch(e){} })();
    var createRun = (typeof LANTERN_API !== 'undefined' && LANTERN_API.createRun) ? LANTERN_API.createRun : null;
    var LS_ADOPTED = 'LANTERN_ADOPTED_CHARACTER';
    var el = function(id){ return document.getElementById(id); };

    var missionVerifyModeActive = false;
    (function(){
      function applyLegacyVerifyHints() {
        try {
          if (localStorage.getItem('LANTERN_VERIFY_CHARACTER_NAME')) {
            missionVerifyModeActive = true;
            return;
          }
        } catch (e1) {}
        var apiBase =
          typeof window !== 'undefined' && typeof window.LANTERN_AVATAR_API !== 'undefined' && window.LANTERN_AVATAR_API !== null
            ? String(window.LANTERN_AVATAR_API).replace(/\/$/, '')
            : null;
        if (apiBase === null) return;
        fetch(apiBase + '/api/verify/state')
          .then(function (r) {
            return r.json();
          })
          .then(function (res) {
            if (res && res.ok && res.state && res.state.character_name) missionVerifyModeActive = true;
          })
          .catch(function () {});
      }

      if (window.LanternAuth && typeof window.LanternAuth.fetchMe === 'function') {
        window.LanternAuth.fetchMe()
          .then(function (me) {
            if (me && me.ok && me.authenticated) {
              missionVerifyModeActive = false;
              if (window.LanternPilotAuth && typeof window.LanternPilotAuth.applyStudentStorageFromSession === 'function') {
                window.LanternPilotAuth.applyStudentStorageFromSession(me);
              }
              return;
            }
            applyLegacyVerifyHints();
          })
          .catch(function () {
            applyLegacyVerifyHints();
          });
      } else {
        applyLegacyVerifyHints();
      }
    })();
    function isMissionWritingIntegrityBypassActive(){ return missionVerifyModeActive; }

    var missionsApiBase = (function () {
      if (typeof window === 'undefined') return null;
      var raw =
        typeof window.LANTERN_AVATAR_API !== 'undefined' && window.LANTERN_AVATAR_API !== null
          ? window.LANTERN_AVATAR_API
          : window.LANTERN_ECONOMY_API;
      if (typeof raw === 'undefined' || raw === null) return null;
      return String(raw).replace(/\/$/, '');
    })();
    function getAdopted(){
      try {
        var auth = window.LanternAuth || window.LanternPilotAuth;
        if (auth && typeof auth.adoptedFromPilotMe === 'function') {
          var a = auth.adoptedFromPilotMe();
          if (a && a.name) return a;
        }
      } catch (e) {}
      return null;
    }
    function getCharacterNameForApi(){
      var adopted = getAdopted();
      if (!adopted) return '';
      return (adopted.character_id || adopted.name || '').trim();
    }

    function todayStr(){
      var d = new Date();

              });
              imgDiv.appendChild(thumb);

          catDiv.appendChild(btn);

      }).catch(function(){ toast('Could not load library'); });

    function handleMissionContentInput(){
      var contentEl = el('missionSubmitContent');
      if (!contentEl) return;
      if (isMissionWritingIntegrityBypassActive()) {
        previousTextareaValue = contentEl.value;
        previousInputTimestamp = Date.now();
        updateMissionSubmitProgress();
        updateMissionSubmitPreview();
        return;
      }
      var currentVal = contentEl.value;
      var currentLen = currentVal.length;
      var previousLen = previousTextareaValue.length;
      var delta = currentLen - previousLen;
      if (delta <= 0) {
        previousTextareaValue = currentVal;
        previousInputTimestamp = Date.now();
        updateMissionSubmitProgress();
        updateMissionSubmitPreview();
        return;
      }
      if (delta >= 10) {
        contentEl.value = previousTextareaValue;
        var pos = previousTextareaValue.length;
        contentEl.setSelectionRange(pos, pos);
        contentEl.focus();
        showMissionBurstWarning();
        updateMissionSubmitProgress();
        return;
      }
      var timeSinceLastInput = Date.now() - previousInputTimestamp;
      if (delta >= 5 && timeSinceLastInput < 30) {
        contentEl.value = previousTextareaValue;
        var pos = previousTextareaValue.length;
        contentEl.setSelectionRange(pos, pos);
        contentEl.focus();
        showMissionBurstWarning();
        updateMissionSubmitProgress();
        return;
      }
      previousTextareaValue = currentVal;
      previousInputTimestamp = Date.now();
      updateMissionSubmitProgress();
      updateMissionSubmitPreview();
    }

    function updateMissionSubmitProgress(){
      var contentEl = el('missionSubmitContent');
      var progressWrap = el('missionSubmitProgressWrap');
      var fillEl = el('missionSubmitProgressFill');
      var countdownEl = el('missionSubmitCountdown');
      var submitBtn = el('missionSubmitBtn');
      var minReq = currentMissionMinChars;
      var imageUrlEl = el('missionSubmitImageUrl');
      var hasImage = (imageUrlEl && (imageUrlEl.value || '').trim().length > 0);
      if (currentMissionRequiresImage && !hasImage) {
        if (submitBtn) submitBtn.disabled = true;
        if (progressWrap && fillEl && countdownEl) {
          var len = (contentEl && contentEl.value || '').trim().length;
          var remaining = Math.max(0, minReq - len);
          var pct = minReq > 0 ? Math.min(100, Math.floor((len / minReq) * 100)) : 100;
          if (fillEl) { fillEl.style.width = pct + '%'; fillEl.className = 'missionSubmitProgressFill ' + (pct >= 100 ? 'met' : (pct >= 75 ? 'amber' : 'neutral')); }
          if (countdownEl) { countdownEl.textContent = remaining + ' / ' + minReq + ' remaining' + (remaining <= 0 ? ' ✓' : ''); countdownEl.className = 'missionSubmitCountdown ' + (pct >= 100 ? 'met' : (pct >= 75 ? 'amber' : 'neutral')); }
        }
        return;
      }
      if (!progressWrap || progressWrap.style.display === 'none' || minReq <= 0){
        if (submitBtn) submitBtn.disabled = false;
        return;
      }
      var len = (contentEl && contentEl.value || '').trim().length;
      var remaining = Math.max(0, minReq - len);
      var pct = minReq > 0 ? Math.min(100, Math.floor((len / minReq) * 100)) : 100;
      var barEl = el('missionSubmitProgressBar');
      if (barEl) barEl.setAttribute('aria-valuenow', pct);
      if (fillEl) {
        fillEl.style.width = pct + '%';
        fillEl.className = 'missionSubmitProgressFill ' + (pct >= 100 ? 'met' : (pct >= 75 ? 'amber' : 'neutral'));
      }
      if (countdownEl) {
        countdownEl.textContent = remaining + ' / ' + minReq + ' remaining' + (remaining <= 0 ? ' ✓' : '');
        countdownEl.className = 'missionSubmitCountdown ' + (pct >= 100 ? 'met' : (pct >= 75 ? 'amber' : 'neutral'));
      }
      if (submitBtn) submitBtn.disabled = remaining > 0;
    }

    function openMissionSubmitModal(m, resubmitId, prefill){
      currentMissionForSubmit = m;

      missionDetailReturnFocus = document.activeElement;
      destroyMissionUnifiedField();
      var titleEl = el('missionDetailTitle');
      var metaEl = el('missionDetailMeta');
      var descEl = el('missionDetailDesc');
      var labelEl = el('missionSubmitLabel');
      var contentEl = el('missionSubmitContent');
      var textWrap = el('missionSubmitTextWrap');
      var urlEl = el('missionSubmitUrl');
      var imageUrlEl = el('missionSubmitImageUrl');
      var videoUrlEl = el('missionSubmitVideoUrl');

      var bugWrap = el('missionSubmitBugReportWrap');

      var isBugMission = stMission === 'bug_report';

      var allowsImage = !!(m.allows_image);
      var allowsVideo = !!(m.allows_video);
      var allowsLink = !!(m.allows_link);

      if (labelEl) labelEl.textContent = m.submission_type === 'confirmation' ? 'Optional note' : 'Your response';
      if (textWrap) textWrap.style.display = (!isPollMission && !isBugMission && allowsText) ? 'block' : 'none';
      if (pollWrap) pollWrap.style.display = isPollMission ? 'block' : 'none';
      if (bugWrap) bugWrap.style.display = isBugMission ? 'block' : 'none';
      var outer = el('missionUnifiedMediaOuter');
      if (outer) outer.style.display = anyMed ? 'block' : 'none';
      var pf = (typeof prefill === 'string') ? prefill : '';
      missionVideoUploadedUrl = '';
      if (contentEl) contentEl.value = '';
      if (imageUrlEl) imageUrlEl.value = '';
      if (videoUrlEl) videoUrlEl.value = '';
      if (urlEl) urlEl.value = '';
      if (isPollMission || isBugMission) {
        currentMissionMinChars = 0;
        currentMissionRequiresImage = false;
      } else {
        if (contentEl) contentEl.value = allowsText ? pf : '';
        if (imageUrlEl) imageUrlEl.value = m.submission_type === 'image_url' ? pf : '';
        var minChars = m.min_characters !== undefined && m.min_characters !== null ? Math.max(0, parseInt(m.min_characters, 10) || 200) : 0;
        var enforceMin = allowsText && minChars > 0;
        currentMissionMinChars = enforceMin ? minChars : 0;
        currentMissionRequiresImage = allowsImage && !allowsText && !allowsVideo && !allowsLink;
        var minCharsHint = el('missionSubmitMinCharsHint');
        if (minCharsHint) {
          if (allowsText && minChars > 0) {
            minCharsHint.textContent = 'Minimum characters required: ' + minChars;
            minCharsHint.style.display = 'block';
          } else minCharsHint.style.display = 'none';
        }
        var progressWrap = el('missionSubmitProgressWrap');
        if (progressWrap) progressWrap.style.display = currentMissionMinChars > 0 ? 'block' : 'none';
      }
      if (anyMed) mountMissionUnifiedField(allowsImage, allowsVideo, allowsLink);
      var previewWrap = el('missionSubmitPreviewWrap');
      if (previewWrap) previewWrap.style.display = 'block';
      updateMissionSubmitPreview();

    function typeBadgeForTeacher(m){
      var st = String(m.submission_type || '').trim();

    function wireMissionDetailModal(){
      var closeBtn = el('missionDetailClose');
      var overlay = el('missionDetailOverlay');
      if (closeBtn && !closeBtn._wired) {
        closeBtn._wired = true;
        closeBtn.addEventListener('click', function(){ closeMissionDetailModal(); });
      }
      if (overlay && !overlay._wired) {
        overlay._wired = true;
        overlay.addEventListener('click', function(e){
          if (e.target === overlay) closeMissionDetailModal();
        });
        document.addEventListener('keydown', function(e){
          if (e.key === 'Escape' && overlay.classList.contains('is-open')) {
            e.preventDefault();
            closeMissionDetailModal();
          }
        });
      }
      if (el('missionSubmitContent') && !el('missionSubmitContent')._wiredInput) {
        el('missionSubmitContent')._wiredInput = true;
        el('missionSubmitContent').addEventListener('input', handleMissionContentInput);
      }
      if (el('missionSubmitBtn') && !el('missionSubmitBtn')._wired) {
        el('missionSubmitBtn')._wired = true;
        el('missionSubmitBtn').addEventListener('click', submitCurrentMission);
      }
      if (el('missionCropperUseBtn')) el('missionCropperUseBtn').addEventListener('click', finishMissionCropper);
      if (el('missionCropperCancelBtn')) el('missionCropperCancelBtn').addEventListener('click', function(){
        if (missionCropperInstance){ try { missionCropperInstance.destroy(); } catch(e){} missionCropperInstance = null; }
        el('missionCropperModal').style.display = 'none';
      });
      if (el('missionSubmitPollLibraryBtn')) el('missionSubmitPollLibraryBtn').addEventListener('click', function(){ openLibraryPicker('poll'); });
      if (el('missionSubmitLibraryCloseBtn')) el('missionSubmitLibraryCloseBtn').addEventListener('click', function(){
        var lm = el('missionSubmitLibraryModal');
        if (lm){ lm.style.display = 'none'; lm.classList.remove('show'); }
      });

    function submitCurrentMission(){
      var adopted = getAdopted();
      if (!adopted || !adopted.name){ toast('Sign in to submit missions.'); return; }
      if (!currentMissionForSubmit){ toast('No mission selected'); return; }
      var m = currentMissionForSubmit;
      var btnM = el('missionSubmitBtn');
      var mst = String(m.submission_type || '').trim();
      if (mst === 'poll'){
        var pq = (el('missionSubmitPollQuestion') && el('missionSubmitPollQuestion').value || '').trim();
        var pch = [1,2,3,4].map(function(i){ return (el('missionSubmitPollChoice' + i) && el('missionSubmitPollChoice' + i).value || '').trim(); }).filter(Boolean);
        var pimg = (el('missionSubmitPollImageUrl') && el('missionSubmitPollImageUrl').value || '').trim();
        if (!pq){ toast('Enter your poll question.'); return; }
        if (pch.length < 2 || pch.length > 4){ toast('Enter 2 to 4 answer choices.'); return; }
        if (!pimg){ toast('Add a poll image URL or pick from the library.'); return; }
        var pollPayload = JSON.stringify({ question: pq.slice(0, 500), choices: pch.map(function(c){ return c.slice(0, 200); }), image_url: pimg.slice(0, 500) });
        btnM.disabled = true;
        var resPP = currentResubmitId
          ? callResubmitMissionSubmission(currentResubmitId, pollPayload)
          : callSubmitMissionCompletion(m.id, getCharacterNameForApi() || adopted.name, 'poll', pollPayload);
        Promise.resolve(resPP).then(function(resP){
          btnM.disabled = false;
          if (!resP || !resP.ok){ toast((resP && resP.error) || 'Failed'); return; }
          toast(FERPA_STUDENT_SUBMIT_MESSAGE);
          closeMissionDetailModal();
          loadMissions();
        });
        return;
      }
      if (mst === 'bug_report'){
        var bdesc = (el('missionSubmitBugReportDesc') && el('missionSubmitBugReportDesc').value || '').trim();
        var bimg = (el('missionSubmitBugReportScreenshot') && el('missionSubmitBugReportScreenshot').value || '').trim();
        if (!bdesc){ toast('Description is required.'); return; }
        var bugPayload = JSON.stringify({ description: bdesc.slice(0, 2000), image_url: bimg ? bimg.slice(0, 500) : '' });
        btnM.disabled = true;
        Promise.resolve(currentResubmitId
          ? callResubmitMissionSubmission(currentResubmitId, bugPayload)
          : callSubmitMissionCompletion(m.id, getCharacterNameForApi() || adopted.name, 'bug_report', bugPayload)
        ).then(function(resB){
          btnM.disabled = false;
          if (!resB || !resB.ok){ toast((resB && resB.error) || 'Failed'); return; }
          toast(FERPA_STUDENT_SUBMIT_MESSAGE);
          closeMissionDetailModal();
          loadMissions();
        });
        return;
      }
      var allowsText = m.allows_text !== false && m.allows_text !== 0;
      var allowsImage = !!(m.allows_image);
      var allowsVideo = !!(m.allows_video);
      var allowsLink = !!(m.allows_link);
      var textVal = (el('missionSubmitContent') && el('missionSubmitContent').value || '').trim();
      var imageVal = (el('missionSubmitImageUrl') && el('missionSubmitImageUrl').value || '').trim();
      var videoVal = (el('missionSubmitVideoUrl') && el('missionSubmitVideoUrl').value || '').trim();
      var linkVal = (el('missionSubmitUrl') && el('missionSubmitUrl').value || '').trim();
      var minChars = currentMissionMinChars;
      var validText = allowsText && (minChars <= 0 ? textVal.length > 0 : textVal.length >= minChars);
      var validImage = allowsImage && (imageVal.length > 0 || (el('missionSubmitImageUploadPreviewImg') && el('missionSubmitImageUploadPreviewImg').src));
      var validVideo = allowsVideo && (missionVideoUploadedUrl || videoVal.length > 0);
      var validLink = allowsLink && linkVal.length > 0;
      if (!(validText || validImage || validVideo || validLink)) {
        if (allowsText && minChars > 0 && textVal.length > 0 && textVal.length < minChars) toast('Minimum ' + minChars + ' characters required.');
        else toast('Please add a valid submission before sending.');
        return;
      }
      var type = 'text';
      var content = '';
      if (validText && validImage){
        // Student wrote text AND attached a photo — preserve both using the existing
        // JSON-in-content envelope convention (same shape teacher review / Explore already parse).
        type = 'text';
        content = JSON.stringify({ text: textVal.slice(0, 1800), image_url: imageVal.slice(0, 500) });
      }
      else if (allowsText && textVal){ type = 'text'; content = textVal; }
      else if (allowsImage && imageVal){ type = 'image_url'; content = imageVal; }
      else if (allowsVideo && missionVideoUploadedUrl){ type = 'video'; content = missionVideoUploadedUrl; }
      else if (allowsVideo && videoVal){ type = 'link'; content = videoVal; }
      else if (allowsLink && linkVal){ type = 'link'; content = linkVal; }
      if (m.submission_type === 'confirmation') type = 'confirmation';
      btnM.disabled = true;
      Promise.resolve(currentResubmitId
        ? callResubmitMissionSubmission(currentResubmitId, content)
        : callSubmitMissionCompletion(m.id, getCharacterNameForApi() || adopted.name, type, content)
      ).then(function(res){
        btnM.disabled = false;
        if (!res || !res.ok){ toast((res && res.error) || 'Failed'); return; }
        toast(FERPA_STUDENT_SUBMIT_MESSAGE);
        closeMissionDetailModal();
        loadMissions();
      });
    }

    var STALE_MISSION_TITLES = { 'fff': 1, 'ff': 1, 'help someone': 1 };
    function filterStaleMissions(missions){
      if (!Array.isArray(missions)) return missions || [];
      return missions.filter(function(m){
        var t = (m.title || '').trim().toLowerCase();
        return !STALE_MISSION_TITLES[t];
      });
    }

    function loadMissions(){
      var adopted = getAdopted();
      if (!adopted || !adopted.name){
        refreshMissionLibrary({}, [], [], false);
        return;
      }
      refreshMissionLibrary({}, [], [], true);
      var characterNameForApi = getCharacterNameForApi() || adopted.name;
      var quickData = {};
      var teacherData = [];
      var subsData = [];
      var pending = 3;
      function done(){
        pending--;
        if (pending <= 0) refreshMissionLibrary(quickData, filterStaleMissions(teacherData), subsData, false);
      }
      callGetMissions(adopted.name).then(function(res){
        quickData = (res && res.missions) || {};
        done();
      });
      callGetActiveTeacherMissionsForCharacter(characterNameForApi).then(function(res){
        teacherData = (res && res.ok && res.missions) ? res.missions : [];
        done();
      }).catch(function(){ done(); });
      callGetMissionSubmissionsForCharacter(characterNameForApi).then(function(sres){
        subsData = (sres && sres.submissions) || [];
        done();
      });
    }

    window.LanternMissionsRuntime = {
      getAdopted: getAdopted,
      getCharacterNameForApi: getCharacterNameForApi,
      toast: toast,
      loadMissions: loadMissions,
      openMissionSubmitModal: openMissionSubmitModal,
    };

    var missionsPageBooted = false;
    window.__bootMissionsPage = function bootMissionsPage(){
      if (missionsPageBooted) return;
      var auth = window.LanternAuth || window.LanternPilotAuth;
      var me = auth && typeof auth.getCachedPilotMe === 'function' ? auth.getCachedPilotMe() : null;
      if (!me || me.authenticated !== true) return;
      missionsPageBooted = true;
      wireMissionDetailModal();
      if (window.LanternMissionsPage && typeof window.LanternMissionsPage.init === 'function') {
        window.LanternMissionsPage.init();
      }
      loadMissions();
    };

    document.addEventListener('lantern-class-access-resolved', function(){
      window.__bootMissionsPage();
    });
    var contentWrap = document.getElementById('classAccessContentWrap');
    if (contentWrap && getComputedStyle(contentWrap).visibility === 'visible') {
      window.__bootMissionsPage();
    }

    /* Class access bootstrap runs from js/class-access.js on DOMContentLoaded. */
  </script>
  <script src="js/lantern-canonical-enforce.js"></script>
</body>
</html>
